<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المشاريع | Saqeel Resources</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap" rel="stylesheet">
</head>

<body class="page-body">
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="back-btn">⬅ العودة للرئيسية</a>
      <h2>المشاريع</h2>
      <span class="license-badge">مرخصة برقم: 1000810600</span>
    </div>
  </header>

  <main class="container mt-4" id="dynamic-projects-container">
    <p style="text-align: center;">جاري تحميل المشاريع...</p>
  </main>

  <script>
    fetch('data/projects.json')
      .then(response => {
        if (!response.ok) throw new Error('لا توجد بيانات حالياً');
        return response.json();
      })
      .then(data => {
        const container = document.getElementById('dynamic-projects-container');
        container.innerHTML = '';

        if (data.projects_list && data.projects_list.length > 0) {
          data.projects_list.forEach((project, index) => {
            // استخدام details و summary لجعل المشروع قابلاً للفتح والإغلاق بالضغط على اسمه
            // جعلنا أول مشروع مفتوح افتراضياً والباقي مغلق
            const isOpen = index === 0 ? 'open' : '';

            let projectHTML = `
                            <details class="project-section" ${isOpen}>
                                <summary class="project-title">🚀 ${project.title}</summary>
                                <div class="project-content">
                                    ${project.description ? `<p class="project-desc">${project.description}</p>` : ''}
                                    ${project.drive_folder_url ? `<a href="${project.drive_folder_url}" target="_blank" class="btn btn-drive">📤 رفع صور المشروع</a>` : ''}
                                    <div class="files-grid">
                        `;

            if (project.project_files && project.project_files.length > 0) {
              project.project_files.forEach(fileItem => {
                projectHTML += `
                                    <div class="file-card">
                                        <h4>${fileItem.file_title}</h4>
                                        <div class="action-buttons">
                                            <a href="${fileItem.file}" target="_blank" class="btn btn-preview">👀 معاينة</a>
                                            <a href="${fileItem.file}" download class="btn btn-download">⬇ تنزيل</a>
                                        </div>
                                    </div>
                                `;
              });
            } else {
              projectHTML += `<p>لا توجد ملفات مرفقة بهذا المشروع حالياً.</p>`;
            }

            projectHTML += `</div></div></details>`;
            container.innerHTML += projectHTML;
          });
        } else {
          container.innerHTML = '<p style="text-align: center;">لم يتم إضافة مشاريع بعد من لوحة التحكم.</p>';
        }
      })
      .catch(error => {
        console.error('Error fetching data:', error);
        document.getElementById('dynamic-projects-container').innerHTML = '<p style="text-align: center;">لم يتم العثور على مشاريع.</p>';
      });
  </script>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="footer-year">2026</span> جمعية صقيل لتنمية الشباب. جميع الحقوق محفوظة.</p>
    </div>
  </footer>
  <script>
    document.getElementById('footer-year').textContent = new Date().getFullYear();
  </script>
</body>

</html>
