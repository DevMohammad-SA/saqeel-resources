<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الهوية البصرية | Saqeel Resources</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap" rel="stylesheet">
</head>

<body class="page-body">
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="back-btn">⬅ العودة للرئيسية</a>
      <h2>الهوية البصرية</h2>
      <span class="license-badge">مرخصة برقم: 1000810600</span>
    </div>
  </header>

  <main class="container mt-4">
    <p class="section-desc">الشعارات الرسمية والأدلة البصرية للجمعية:</p>

    <div class="files-grid" id="dynamic-identity-container">
      <p style="text-align: center;">جاري تحميل ملفات الهوية...</p>
    </div>
  </main>

  <script>
    fetch('data/identity.json')
      .then(response => {
        if (!response.ok) throw new Error('لا توجد بيانات حالياً');
        return response.json();
      })
      .then(data => {
        const container = document.getElementById('dynamic-identity-container');
        container.innerHTML = '';

        if (data.files_list && data.files_list.length > 0) {
          data.files_list.forEach(item => {
            container.innerHTML += `
                            <div class="file-card">
                                <h3>${item.title}</h3>
                                <img src="${item.file}" alt="${item.title}" class="logo-preview" loading="lazy">
                                <div class="action-buttons">
                                    <a href="${item.file}" download class="btn btn-download">⬇ تنزيل</a>
                                </div>
                            </div>
                        `;
          });
        } else {
          container.innerHTML = '<p style="text-align: center;">لم يتم إضافة ملفات هوية بعد من لوحة التحكم.</p>';
        }
      })
      .catch(error => {
        console.error('Error fetching data:', error);
        document.getElementById('dynamic-identity-container').innerHTML = '<p style="text-align: center;">لم يتم العثور على ملفات.</p>';
      });
  </script>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="footer-year">2026</span> جمعية صقيل لتنمية الشباب. جميع الحقوق محفوظة.</p>
    </div>
  </footer>
  <script>
    document.getElementById('footer-year').textContent = new Date().getFullYear();
  </script>
</body>

</html>
