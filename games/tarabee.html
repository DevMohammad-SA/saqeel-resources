/* ================= رموز التصميم ================= */
:root {
  --night: #0A1F3B;   /* الخلفية — مشتق من كحلي شعار صقيل */
  --deep: #0F2A4E;    /* الأشرطة */
  --panel: #14305A;   /* البطاقات */
  --cell: #1B3A63;    /* المربع الفارغ (مطابق لـ CONFIG.EMPTY_CELL_COLOR) */
  --edge: #264D7E;
  --ink: #F4F8FC;
  --muted: #A3B8D2;
  --teal: #24CCC2;
  --coral: #FF686B;
  --orange: #FFB76C;
  --yellow: #FFF57F;
}
* { box-sizing: border-box; }
html { font-size: clamp(15px, 0.42vw + 9.5px, 22px); }
body {
  margin: 0;
  font-family: 'Tajawal', 'Cairo', 'Segoe UI', system-ui, sans-serif;
  background: var(--night);
  color: var(--ink);
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }

/* لمعة الجوهرة على المربعات الملوّنة */
.gem {
  background-image: linear-gradient(135deg, rgba(255,255,255,.30) 0%, rgba(255,255,255,0) 44%, rgba(0,0,0,0) 56%, rgba(0,0,0,.16) 100%);
}

.screen { display: none; min-height: 100dvh; }
.screen.is-on { display: flex; }

/* ================= الأزرار ================= */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  min-height: 2.9rem; padding: 0 1.2rem;
  border-radius: 12px; border: 2px solid transparent;
  font-weight: 700; font-size: 1rem; line-height: 1;
  cursor: pointer; white-space: nowrap;
  transition: background-color .15s, border-color .15s, opacity .15s;
}
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .38; filter: grayscale(1); cursor: not-allowed; }
.btn--primary { background: var(--teal); color: #05302F; }
.btn--primary:hover:not(:disabled) { background: #3ADBD1; }
.btn--warm { background: var(--orange); color: #3B2003; }
.btn--warm:hover:not(:disabled) { background: #FFC688; }
.btn--ghost { background: transparent; border-color: var(--edge); }
.btn--ghost:hover:not(:disabled) { background: rgba(255,255,255,.06); }
.btn--danger { background: transparent; border-color: rgba(255,104,107,.6); color: #FFA3A5; }
.btn--danger:hover:not(:disabled) { background: rgba(255,104,107,.12); }
.btn--solid-danger { background: var(--coral); color: #3A0506; }
.btn__icon { font-size: 1.1em; }

/* ================= شاشة البداية ================= */
.start {
  flex-direction: column; align-items: center; justify-content: center;
  padding: 2rem 1rem; text-align: center; position: relative; overflow: hidden;
}
/* معيّن كبير خافت خلف المحتوى — صدى لشكل الجوهرة في الشعار */
.start::before, .start::after {
  content: ''; position: absolute; left: 50%; top: 50%;
  width: 78vmin; height: 78vmin; border: 1px solid rgba(36,204,194,.13);
  transform: translate(-50%, -50%) rotate(45deg); border-radius: 18px; pointer-events: none;
}
.start::after { width: 104vmin; height: 104vmin; border-color: rgba(255,183,108,.08); }
.start > * { position: relative; z-index: 1; }
.start__logo {
  width: 9rem; height: 9rem; background: #fff; border-radius: 26px;
  display: grid; place-items: center; padding: .9rem;
  box-shadow: 0 24px 60px -24px rgba(0,0,0,.7);
}
.start__logo img { max-width: 100%; max-height: 100%; display: block; }
.start__title { font-weight: 900; font-size: clamp(2.9rem, 9vw, 5.4rem); line-height: 1.15; margin: 1.8rem 0 .2rem; }
.start__tagline { font-size: 1.4rem; font-weight: 700; color: var(--orange); margin: 0 0 2.4rem; }
.count__label { font-weight: 700; color: var(--muted); margin: 0 0 .8rem; font-size: 1.05rem; }
.count__grid { display: grid; grid-template-columns: repeat(11, 3.3rem); gap: .45rem; justify-content: center; }
.count__tile {
  aspect-ratio: 1; border-radius: 10px; cursor: pointer;
  background: var(--cell); border: 2px solid var(--edge);
  font-weight: 900; font-size: 1.3rem;
}
.count__tile:hover { border-color: var(--teal); }
.count__tile[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: #05302F; }
.start__cta { margin-top: 2.1rem; min-width: 15rem; min-height: 3.7rem; font-size: 1.3rem; border-radius: 14px; }
.brandfoot { margin-top: 2.6rem; display: flex; gap: 1.4rem; justify-content: center; flex-wrap: wrap; color: var(--muted); font-size: .95rem; }
.brandfoot a { color: inherit; text-decoration: none; }
.brandfoot a:hover { color: var(--teal); }

/* ================= إعداد اللاعبين ================= */
.setup { flex-direction: column; align-items: center; padding: 1.4rem 1rem 8rem; }
.setup__head, .roster { width: 100%; max-width: 64rem; }
.setup__head { display: flex; align-items: flex-start; gap: 1rem; margin-bottom: 1.2rem; }
.setup__title { font-size: 2rem; font-weight: 900; margin: 0; line-height: 1.3; }
.setup__hint { color: var(--muted); margin: .2rem 0 0; line-height: 1.7; }
.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(19rem, 1fr)); gap: .8rem; align-items: start; }
.prow { background: var(--panel); border: 2px solid transparent; border-radius: 14px; padding: .75rem; }
.prow.has-error { border-color: rgba(255,104,107,.75); }
.prow__main { display: flex; gap: .7rem; align-items: center; }
.swatch-btn { width: 3rem; height: 3rem; flex: none; border-radius: 10px; border: 2px solid rgba(255,255,255,.3); cursor: pointer; }
.prow__name {
  flex: 1; min-width: 0; height: 3rem; padding: 0 .85rem;
  border-radius: 10px; border: 2px solid var(--edge); background: var(--night);
  font-weight: 700; font-size: 1.1rem;
}
.prow__name:focus { border-color: var(--teal); outline: none; }
.prow__error { color: #FFA3A5; font-size: .92rem; font-weight: 500; margin: .5rem 0 0; }
.palette { display: grid; grid-template-columns: repeat(6, 1fr); gap: .45rem; margin-top: .75rem; }
.palette__swatch { aspect-ratio: 1; border-radius: 8px; border: 3px solid transparent; cursor: pointer; }
.palette__swatch[aria-pressed="true"] { border-color: #fff; }
.palette__swatch:disabled { opacity: .16; cursor: not-allowed; }
.palette__custom { grid-column: 1 / -1; display: flex; align-items: center; gap: .6rem; color: var(--muted); font-size: .95rem; cursor: pointer; margin-top: .2rem; }
.palette__custom input { width: 2.8rem; height: 2rem; border: 0; padding: 0; background: none; cursor: pointer; }
.setup__bar {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 5;
  display: flex; align-items: center; justify-content: center; gap: 1rem; flex-wrap: wrap;
  padding: 2rem 1rem max(1rem, env(safe-area-inset-bottom));
  background: linear-gradient(to bottom, rgba(10,31,59,0), var(--night) 45%);
}
.setup__summary { color: #FFA3A5; font-weight: 700; }
.setup__go { min-width: 13rem; min-height: 3.5rem; font-size: 1.2rem; }

/* ================= شاشة اللعب ================= */
.game { flex-direction: column; --topbar-h: 3rem; --pad: .75rem; }
.topbar {
  display: flex; align-items: center; gap: 1rem; flex-wrap: nowrap; height: var(--topbar-h);
  padding: 0 1rem; background: var(--deep); border-bottom: 1px solid var(--edge);
}
.topbar__brand { display: flex; align-items: center; gap: .55rem; font-weight: 900; font-size: 1.35rem; white-space: nowrap; }
.topbar__brand img { height: 1.9rem; width: auto; display: block; }
.topbar__info { display: flex; gap: .5rem; flex: 1; min-width: 0; overflow: hidden; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: .45rem; background: var(--panel); border-radius: 999px; padding: .3rem .85rem; color: var(--muted); font-weight: 500; white-space: nowrap; }
.chip strong { color: var(--ink); font-weight: 800; }
.diamond { display: inline-block; width: .85rem; height: .85rem; transform: rotate(45deg); border-radius: 2px; flex: none; }
.topbar__actions { display: flex; gap: .5rem; }
.topbar .btn { min-height: 2.2rem; padding: 0 .9rem; font-size: .95rem; }

.game__body {
  /* الشبكة تأخذ كامل ارتفاع الشاشة المتاح، وما يتبقى من العرض للعمود الجانبي */
  --board-size: max(18rem, min(calc(100dvh - var(--topbar-h) - 2 * var(--pad) - 1px), calc(100vw - 18rem - 3 * var(--pad) - 1rem)));
  flex: 1; display: grid; grid-template-columns: minmax(18rem, 46rem) var(--board-size);
  justify-content: center; align-items: start; align-content: start;
  gap: var(--pad); padding: var(--pad);
}
.side {
  display: flex; flex-direction: column; gap: .6rem; min-width: 0;
  height: var(--board-size); min-height: 0;
}

/* بطاقات اللاعبين — ترتيبها ثابت حتى يجدها المقدم بسرعة */
.players {
  flex: 1; min-height: 0; overflow: auto; padding: .15rem; align-content: start;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(13.5rem, 1fr)); gap: .45rem;
  scrollbar-width: thin; scrollbar-color: var(--edge) transparent;
}
.pcard {
  --pc: #fff;
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .7rem;
  width: 100%; padding: .45rem .7rem; text-align: start; cursor: pointer;
  border-radius: 12px; border: 3px solid transparent; background: var(--panel);
}
.pcard:hover { background: #193A68; }
.pcard__swatch { width: 2.1rem; height: 2.1rem; border-radius: 8px; }
.pcard__text { min-width: 0; display: flex; flex-direction: column; gap: .1rem; }
.pcard__name { font-weight: 800; font-size: 1.12rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pcard__squares { color: var(--muted); font-size: .85rem; }
.pcard__score { display: flex; flex-direction: column; align-items: center; font-weight: 900; font-size: 1.8rem; line-height: 1; }
.pcard__score small { font-size: .72rem; font-weight: 500; color: var(--muted); margin-top: .15rem; }
.pcard.is-active { border-color: var(--pc); background: color-mix(in srgb, var(--pc) 18%, var(--panel)); }
.pcard.is-active .pcard__swatch { box-shadow: 0 0 0 3px var(--night), 0 0 0 5px var(--pc); }

.stage { min-width: 0; }
.controls {
  display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; flex: none;
  background: var(--deep); border: 1px solid var(--edge); border-radius: 14px; padding: .55rem .7rem;
}
.status { flex: 1 1 100%; min-width: 0; display: flex; align-items: center; gap: .55rem; font-weight: 700; font-size: 1.1rem; line-height: 1.45; }
.status.is-ok { color: var(--yellow); }
.status.is-warn { color: #FFA3A5; }
.status.nudge { animation: nudge .35s; }
@keyframes nudge { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.controls__btns { display: flex; gap: .45rem; flex-wrap: wrap; width: 100%; }
.controls__btns .btn { flex: 1; padding: 0 .7rem; }

/* الشبكة: العنصر الرئيسي */
.board {
  --n: 10; --pc: transparent;
  display: grid; grid-template-columns: repeat(var(--n), 1fr);
  gap: clamp(2px, .3vw, 5px); padding: clamp(4px, .5vw, 9px);
  width: var(--board-size); aspect-ratio: 1;
  background: #0C2544; border: 2px solid var(--edge); border-radius: 16px;
  direction: rtl; touch-action: manipulation;
  container-type: inline-size; /* لتحجيم الأرقام مع حجم الشبكة */
  transition: border-color .2s, box-shadow .2s;
}
.board.is-armed { border-color: var(--pc); box-shadow: 0 0 0 4px color-mix(in srgb, var(--pc) 30%, transparent), 0 0 48px -10px var(--pc); }
.cell {
  --oc: transparent;
  appearance: none; border: 0; padding: 0; margin: 0; min-width: 0; min-height: 0;
  position: relative; border-radius: clamp(3px, .38vw, 6px);
  background-color: var(--cell); cursor: default;
  display: grid; place-items: center;
}
/* رقم المربع: يكبر ويصغر مع الشبكة، ولونه يتباين مع لون المالك */
.cell__num {
  position: relative; z-index: 1; pointer-events: none;
  font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1;
  font-size: 12px; font-size: max(12px, calc(100cqw / var(--n) * .32));
  color: #93A9C6;
}
.cell.is-preview .cell__num { color: var(--ptc); }
.cell.is-target .cell__num { font-weight: 900; }
/* المربع الملوّن لا يعرض رقمه حتى لا يشوّش على الألوان */
.cell.is-owned .cell__num { visibility: hidden; }
.board.is-armed .cell { cursor: pointer; }
/* المربع الملوّن لا يُختار؛ المرقّم (الفارغ) فقط متاح */
.board.is-armed .cell.is-owned { cursor: not-allowed; }
@media (hover: hover) { .board.is-armed .cell:not(.is-owned):hover { box-shadow: inset 0 0 0 2px rgba(255,255,255,.4); } }
.cell.is-owned { background-color: var(--oc); }
/* معاينة الحركة قبل التأكيد */
.cell.is-preview { background-color: color-mix(in srgb, var(--pc) 86%, var(--cell)); box-shadow: inset 0 0 0 3px #fff; z-index: 1; }
.cell.is-same { outline: 2px dashed rgba(255,255,255,.85); outline-offset: -5px; }
.cell.is-target::after {
  content: ''; position: absolute; inset: 17%; transform: rotate(45deg); border-radius: 3px;
  border: 2px solid var(--ptc); opacity: .75;
}
.board.is-pending .cell.is-preview { animation: breathe 1.2s ease-in-out infinite; }
@keyframes breathe { 50% { box-shadow: inset 0 0 0 5px #fff; } }
/* لحظة الاستحواذ: المربع يدور من معيّن إلى مربع */
.cell.is-captured { animation: gem-in .55s cubic-bezier(.2,.8,.25,1.25) both; z-index: 2; }
@keyframes gem-in {
  0% { transform: scale(.35) rotate(45deg); filter: brightness(1.9); }
  60% { transform: scale(1.1) rotate(0); filter: brightness(1.25); }
  100% { transform: none; filter: none; }
}

/* ================= نافذة التأكيد ================= */
.modal { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; padding: 1rem; background: rgba(4,14,28,.74); }
.modal.is-on { display: grid; }
.modal__card { width: 100%; max-width: 27rem; background: var(--deep); border: 1px solid var(--edge); border-radius: 18px; padding: 1.6rem; }
.modal__title { margin: 0 0 .5rem; font-size: 1.45rem; font-weight: 900; }
.modal__text { margin: 0 0 1.4rem; color: var(--muted); line-height: 1.8; }
.modal__btns { display: flex; gap: .6rem; flex-wrap: wrap; }

/* ================= النتائج ================= */
.results { flex-direction: column; align-items: center; padding: 2.2rem 1rem; }
.results__card { width: 100%; max-width: 44rem; }
.results__hero { text-align: center; margin-bottom: 1.8rem; }
.results__gem { width: 5.4rem; height: auto; display: inline-block; }
.results__title { font-size: clamp(2.1rem, 6.5vw, 3.6rem); font-weight: 900; line-height: 1.25; margin: .6rem 0 .3rem; }
.results__sub { color: var(--muted); font-size: 1.15rem; line-height: 1.8; margin: 0; }
.results__sub b { color: var(--orange); }
.rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .5rem; }
.rank__row {
  --pc: #fff;
  display: grid; grid-template-columns: 2.2rem 2.3rem 1fr auto; gap: .8rem; align-items: center;
  background: var(--panel); border: 3px solid transparent; border-radius: 12px; padding: .6rem .9rem;
}
.rank__row.is-winner { border-color: var(--yellow); background: color-mix(in srgb, var(--yellow) 10%, var(--panel)); }
.rank__pos { font-weight: 900; font-size: 1.35rem; color: var(--muted); text-align: center; }
.rank__row.is-winner .rank__pos { color: var(--yellow); }
.rank__swatch { width: 2.3rem; height: 2.3rem; border-radius: 8px; }
.rank__name { font-weight: 800; font-size: 1.15rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank__meta { color: var(--muted); font-size: .88rem; }
.rank__bar { height: .38rem; border-radius: 99px; background: rgba(255,255,255,.08); margin-top: .35rem; overflow: hidden; }
.rank__fill { height: 100%; border-radius: inherit; background: var(--pc); }
.rank__score { font-weight: 900; font-size: 1.9rem; line-height: 1; text-align: center; }
.rank__score small { display: block; font-size: .72rem; font-weight: 500; color: var(--muted); margin-top: .15rem; }
.results__btns { display: flex; gap: .8rem; justify-content: center; flex-wrap: wrap; margin-top: 1.8rem; }
.results__btns .btn { min-width: 12rem; min-height: 3.3rem; font-size: 1.1rem; }

/* ================= الجوال والشاشات الصغيرة ================= */
@media (max-width: 860px) {
  .game { --topbar-h: auto; }
  .topbar { padding: .5rem .7rem; gap: .5rem; flex-wrap: wrap; }
  .topbar__info { overflow: visible; flex-wrap: wrap; }
  .side { display: contents; }
  .players { order: 1; flex: none; overflow: visible; }
  .controls { order: 2; }
  .stage { order: 3; }
  .topbar__brand { font-size: 1.15rem; }
  .topbar__brand img { height: 1.8rem; }
  .topbar__actions { margin-inline-start: auto; }
  .topbar__info { order: 3; flex-basis: 100%; }
  .chip { padding: .3rem .7rem; font-size: .92rem; }
  .game__body { grid-template-columns: 1fr; gap: .7rem; padding: .7rem; --board-size: 100%; }
  .players { grid-template-columns: repeat(auto-fill, minmax(6.9rem, 1fr)); gap: .4rem; }
  /* بطاقة مدمجة: اللون والاسم في سطر، والنقاط والمربعات في سطر */
  .pcard { grid-template-columns: auto 1fr; grid-template-areas: 'sw name' 'score sq'; gap: .2rem .45rem; padding: .4rem .5rem; border-width: 2px; }
  .pcard__text { display: contents; }
  .pcard__swatch { grid-area: sw; width: 1.4rem; height: 1.4rem; border-radius: 5px; justify-self: center; }
  .pcard__name { grid-area: name; }
  .pcard__squares { grid-area: sq; align-self: center; }
  .pcard__score { grid-area: score; }
  .pcard.is-active .pcard__swatch { box-shadow: 0 0 0 2px var(--night), 0 0 0 4px var(--pc); }
  .pcard__name { font-size: .98rem; }
  .pcard__squares { font-size: .76rem; }
  .pcard__score { font-size: 1.3rem; }
  .pcard__score small { display: none; }
  .stage { width: 100%; }
  .hide-narrow { display: none; }
  .topbar .btn { padding: 0 .75rem; }
  .status { flex-basis: 100%; font-size: 1.02rem; }
  .count__grid { grid-template-columns: repeat(6, 3.1rem); }
  .start__logo { width: 7.5rem; height: 7.5rem; }
  .setup__head { flex-direction: column-reverse; gap: .6rem; }
  .rank__row { grid-template-columns: 1.8rem 1.8rem 1fr auto; gap: .6rem; padding: .5rem .7rem; }
  .rank__swatch { width: 1.8rem; height: 1.8rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<script>
/* ==========================================================
   ترابيع صقيل — منطق اللعبة
   لا يعتمد على الواجهة؛ كل دالة تستقبل حالة وتُرجع حالة جديدة
   (بدون تعديل الحالة الأصلية) لتسهيل التراجع والاختبار.
   ========================================================== */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.TarabeeEngine = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // إعدادات قابلة للتعديل مستقبلًا
  const CONFIG = {
    GRID_SIZE: 10,
    MIN_PLAYERS: 2,
    MAX_PLAYERS: 12,
    MIN_COLOR_DISTANCE: 110, // أقل مسافة مسموحة بين لونين (مقياس redmean)
    EMPTY_CELL_COLOR: '#1B3A63', // لون المربع الفارغ — لا يجوز أن يشبهه لون لاعب
    MAX_NAME_LENGTH: 20,
  };

  // ألوان اللاعبين المقترحة: ألوان صقيل أولًا ثم ألوان متباينة إضافية
  const PALETTE = [
    '#24CCC2', // تركوازي صقيل
    '#FF686B', // مرجاني صقيل
    '#FFB76C', // برتقالي صقيل
    '#FFF57F', // أصفر صقيل
    '#F2F2F2', // أبيض
    '#4CC94F', // أخضر
    '#4A5CFF', // أزرق
    '#FF6FD8', // وردي
    '#B983FF', // بنفسجي
    '#8A5A34', // بني (داكن لتبقى الأرقام مقروءة)
    '#B5E61D', // ليموني
    '#8E9AAF', // رمادي
  ];

  /* ---------------- الألوان ---------------- */

  function hexToRgb(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(String(hex).trim());
    if (!m) return null;
    const n = parseInt(m[1], 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }

  // مسافة لونية تقريبية قريبة من إدراك العين (redmean)
  function colorDistance(a, b) {
    const c1 = hexToRgb(a), c2 = hexToRgb(b);
    if (!c1 || !c2) return 0;
    const rm = (c1.r + c2.r) / 2;
    const dr = c1.r - c2.r, dg = c1.g - c2.g, db = c1.b - c2.b;
    return Math.sqrt((2 + rm / 256) * dr * dr + 4 * dg * dg + (2 + (255 - rm) / 256) * db * db);
  }

  function isColorTooClose(color, otherColors) {
    return otherColors.some((c) => colorDistance(color, c) < CONFIG.MIN_COLOR_DISTANCE);
  }

  /* ---------------- إعداد اللاعبين ---------------- */

  function defaultPlayers(count) {
    const n = clampCount(count);
    return Array.from({ length: n }, (_, i) => ({
      id: 'p' + (i + 1),
      name: 'اللاعب ' + (i + 1),
      color: PALETTE[i % PALETTE.length],
    }));
  }

  // يغيّر عدد اللاعبين مع الإبقاء على بيانات من سبق إدخالهم
  function resizePlayers(players, count) {
    const n = clampCount(count);
    const kept = players.slice(0, n).map((p) => ({ ...p }));
    for (let i = kept.length; i < n; i++) {
      const used = kept.map((p) => p.color);
      const color = PALETTE.find((c) => !isColorTooClose(c, used)) || PALETTE[i % PALETTE.length];
      kept.push({ id: 'p' + (i + 1), name: 'اللاعب ' + (i + 1), color });
    }
    return kept;
  }

  function clampCount(count) {
    const n = Math.round(Number(count)) || CONFIG.MIN_PLAYERS;
    return Math.min(CONFIG.MAX_PLAYERS, Math.max(CONFIG.MIN_PLAYERS, n));
  }

  // يُرجع قائمة أخطاء لكل لاعب: { index, field, message }
  function validatePlayers(players) {
    const errors = [];
    if (players.length < CONFIG.MIN_PLAYERS || players.length > CONFIG.MAX_PLAYERS) {
      errors.push({ index: -1, field: 'count', message: 'عدد اللاعبين يجب أن يكون بين 2 و12' });
    }
    const names = players.map((p) => String(p.name || '').trim());
    players.forEach((p, i) => {
      if (!names[i]) errors.push({ index: i, field: 'name', message: 'اكتب اسم اللاعب' });
      else if (names.indexOf(names[i]) !== i) errors.push({ index: i, field: 'name', message: 'الاسم مكرر' });

      if (!hexToRgb(p.color)) {
        errors.push({ index: i, field: 'color', message: 'لون غير صالح' });
      } else if (colorDistance(p.color, CONFIG.EMPTY_CELL_COLOR) < CONFIG.MIN_COLOR_DISTANCE) {
        errors.push({ index: i, field: 'color', message: 'اللون قريب من لون المربع الفارغ' });
      } else {
        const earlier = players.slice(0, i).map((q) => q.color);
        if (isColorTooClose(p.color, earlier)) {
          errors.push({ index: i, field: 'color', message: 'اللون قريب جدًا من لون لاعب آخر' });
        }
      }
    });
    return errors;
  }

  /* ---------------- حالة اللعبة ---------------- */

  function createGame(players, gridSize) {
    const size = gridSize || CONFIG.GRID_SIZE;
    const clean = players.map((p) => ({ id: p.id, name: String(p.name).trim(), color: p.color }));
    return {
      players: clean,
      gridSize: size,
      board: new Array(size * size).fill(null), // كل خانة: معرّف المالك أو null
      scores: Object.fromEntries(clean.map((p) => [p.id, 0])),
      activePlayerId: null, // لا يوجد ترتيب أدوار — المقدم يختار بحرية
      moveArmed: false, // true بعد ضغط «إجابة صحيحة» وحتى تنفيذ حركة واحدة
      moveHistory: [], // لقطات لما قبل كل حركة، للتراجع المتعدد
      lastMove: null,
    };
  }

  // لعبة جديدة بنفس اللاعبين
  function resetGame(state) {
    return createGame(state.players, state.gridSize);
  }

  // اختيار لاعب نشط. اختيار لاعب مختلف يُلغي تفعيل الحركة
  // حتى لا يحصل لاعب على حركة لم تُمنح له. لا يغيّر الشبكة أو النقاط.
  function selectPlayer(state, playerId) {
    if (!state.players.some((p) => p.id === playerId)) return state;
    if (state.activePlayerId === playerId) return state;
    return { ...state, activePlayerId: playerId, moveArmed: false };
  }

  // «إجابة صحيحة»: تمنح اللاعب النشط حركة واحدة
  function markCorrectAnswer(state) {
    if (!state.activePlayerId) return state;
    return { ...state, moveArmed: true };
  }

  function cancelMove(state) {
    return state.moveArmed ? { ...state, moveArmed: false } : state;
  }

  function indexToRowCol(state, index) {
    return { row: Math.floor(index / state.gridSize), col: index % state.gridSize };
  }

  // المربع المختار + الأعلى + الأسفل + اليمين + اليسار، مع تجاهل ما خارج الحدود
  function getAffectedIndices(gridSize, index) {
    const total = gridSize * gridSize;
    if (!Number.isInteger(index) || index < 0 || index >= total) return [];
    const row = Math.floor(index / gridSize), col = index % gridSize;
    const out = [index];
    if (row > 0) out.push(index - gridSize);
    if (row < gridSize - 1) out.push(index + gridSize);
    if (col > 0) out.push(index - 1);
    if (col < gridSize - 1) out.push(index + 1);
    return out;
  }

  // معاينة الحركة دون تنفيذها
  function previewMove(state, index) {
    const mover = state.activePlayerId;
    return getAffectedIndices(state.gridSize, index).map((i) => ({
      index: i,
      from: state.board[i],
      to: mover,
      changes: state.board[i] !== mover,
    }));
  }

  // قاعدة الاختيار: يُختار المربع الفارغ فقط؛ أي مربع ملوّن (ومنه كل مربع اختير سابقًا) لا يُختار.
  // المربع الملوّن تبقى ملكيته قابلة للانتقال إذا اختير مربع فارغ مجاور له.
  function isSelectable(state, index) {
    return Number.isInteger(index) && index >= 0 && index < state.board.length && state.board[index] === null;
  }

  function countSelectable(state) {
    return countEmpty(state);
  }

  function canMove(state, index) {
    return Boolean(state.activePlayerId && state.moveArmed && isSelectable(state, index));
  }

  // تنفيذ الحركة. تُرجع { state, applied, reason, changed }
  function applyMove(state, index) {
    if (!state.activePlayerId) return { state, applied: false, reason: 'no-active-player', changed: [] };
    if (!state.moveArmed) return { state, applied: false, reason: 'not-armed', changed: [] };
    const affected = getAffectedIndices(state.gridSize, index);
    if (!affected.length) return { state, applied: false, reason: 'invalid-cell', changed: [] };
    if (!isSelectable(state, index)) return { state, applied: false, reason: 'occupied', changed: [] };

    const mover = state.activePlayerId;
    const board = state.board.slice();
    const scores = { ...state.scores };
    const changed = [];

    for (const i of affected) {
      const owner = board[i];
      if (owner === mover) continue; // مملوك للاعب نفسه: لا تغيير
      if (owner !== null) scores[owner] = Math.max(0, scores[owner] - 1); // خصم من المالك السابق
      scores[mover] += 1;
      board[i] = mover;
      changed.push({ index: i, from: owner });
    }

    // لقطة كاملة لما قبل الحركة
    const snapshot = {
      board: state.board,
      scores: state.scores,
      activePlayerId: state.activePlayerId,
      moveArmed: state.moveArmed,
      lastMove: state.lastMove,
    };

    const next = {
      ...state,
      board,
      scores,
      moveArmed: false, // حركة واحدة لكل إجابة صحيحة، ولا انتقال تلقائي للاعب آخر
      moveHistory: state.moveHistory.concat([snapshot]),
      lastMove: { playerId: mover, index, changed: changed.map((c) => c.index) },
    };
    return { state: next, applied: true, reason: null, changed };
  }

  // التراجع عن آخر حركة: يعيد الشبكة والنقاط والملكية واللاعب النشط كما كانت
  function undo(state) {
    if (!state.moveHistory.length) return state;
    const history = state.moveHistory.slice(0, -1);
    const snap = state.moveHistory[state.moveHistory.length - 1];
    return {
      ...state,
      board: snap.board,
      scores: snap.scores,
      activePlayerId: snap.activePlayerId,
      moveArmed: snap.moveArmed,
      lastMove: snap.lastMove,
      moveHistory: history,
    };
  }

  /* ---------------- قراءات ---------------- */

  function countOwned(state, playerId) {
    let n = 0;
    for (const o of state.board) if (o === playerId) n++;
    return n;
  }

  function countEmpty(state) {
    let n = 0;
    for (const o of state.board) if (o === null) n++;
    return n;
  }

  function getPlayer(state, id) {
    return state.players.find((p) => p.id === id) || null;
  }

  // ترتيب تنازلي؛ المتعادلون يأخذون المرتبة نفسها
  function getRanking(state) {
    const rows = state.players
      .map((p, order) => ({ ...p, order, score: state.scores[p.id], squares: countOwned(state, p.id) }))
      .sort((a, b) => b.score - a.score || a.order - b.order);
    let rank = 0, prev = null;
    rows.forEach((r, i) => {
      if (r.score !== prev) { rank = i + 1; prev = r.score; }
      r.rank = rank;
    });
    const top = rows.length ? rows[0].score : 0;
    const winners = top > 0 ? rows.filter((r) => r.score === top) : [];
    return { rows, winners };
  }

  return {
    CONFIG, PALETTE,
    hexToRgb, colorDistance, isColorTooClose,
    defaultPlayers, resizePlayers, validatePlayers,
    createGame, resetGame, selectPlayer, markCorrectAnswer, cancelMove,
    getAffectedIndices, indexToRowCol, previewMove, isSelectable, countSelectable, canMove, applyMove, undo,
    countOwned, countEmpty, getPlayer, getRanking,
  };
});

</script>
<script>
/* ==========================================================
   ترابيع صقيل — الواجهة
   تقرأ الحالة من TarabeeEngine وتعرضها فقط؛ كل تغيير في اللعبة
   يمر عبر دوال المحرك. الحالة محفوظة في الذاكرة طوال الجلسة.
   ========================================================== */
(function () {
  'use strict';
  const E = window.TarabeeEngine;
  const $ = (id) => document.getElementById(id);

  // حالة الواجهة — منفصلة عن حالة اللعبة (ui.game)
  const ui = {
    screen: 'start',
    playerCount: 4,
    setupPlayers: E.defaultPlayers(4),
    openPalette: -1,
    game: null,
    pendingIndex: null, // مربع محدد بانتظار التأكيد
    hoverIndex: null,   // معاينة بالمؤشر (أجهزة الكمبيوتر)
    notice: null,       // { type: 'ok'|'warn'|'info', text }
    captured: [],       // مربعات تظهر عليها حركة الاستحواذ
    modalConfirm: null,
  };

  const canHover = window.matchMedia('(hover: hover)').matches;
  const isNarrow = () => window.matchMedia('(max-width: 860px)').matches;

  /* ---------- أدوات نصية ---------- */
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function squaresText(n) {
    if (n === 0) return 'لا مربعات';
    if (n === 1) return 'مربع واحد';
    if (n === 2) return 'مربعان';
    if (n <= 10) return n + ' مربعات';
    return n + ' مربعًا';
  }
  function capturedText(n) {
    if (n === 1) return 'مربع واحد';
    if (n === 2) return 'مربعين';
    if (n <= 10) return n + ' مربعات';
    return n + ' مربعًا';
  }
  function pointsText(n) {
    if (n === 1) return 'نقطة واحدة';
    if (n === 2) return 'نقطتان';
    if (n >= 3 && n <= 10) return n + ' نقاط';
    return n + ' نقطة';
  }
  function joinNames(names) {
    return names.length <= 1 ? names.join('') : names.slice(0, -1).join('، ') + ' و' + names[names.length - 1];
  }

  /* ---------- التنقل بين الشاشات ---------- */
  function showScreen(name) {
    ui.screen = name;
    for (const s of ['start', 'setup', 'game', 'results']) $('screen-' + s).classList.toggle('is-on', s === name);
    if (name === 'start') renderStart();
    if (name === 'setup') renderSetup();
    if (name === 'game') renderGame();
    if (name === 'results') renderResults();
    window.scrollTo(0, 0);
  }

  /* ================= البداية ================= */
  (function buildCountTiles() {
    const grid = $('count-grid');
    for (let n = E.CONFIG.MIN_PLAYERS; n <= E.CONFIG.MAX_PLAYERS; n++) {
      const b = document.createElement('button');
      b.className = 'count__tile num';
      b.textContent = n;
      b.dataset.count = n;
      b.setAttribute('aria-label', n + ' لاعبين');
      grid.appendChild(b);
    }
    grid.addEventListener('click', (e) => {
      const t = e.target.closest('[data-count]');
      if (!t) return;
      ui.playerCount = Number(t.dataset.count);
      ui.setupPlayers = E.resizePlayers(ui.setupPlayers, ui.playerCount);
      renderStart();
    });
  })();

  function renderStart() {
    for (const t of $('count-grid').children) t.setAttribute('aria-pressed', String(Number(t.dataset.count) === ui.playerCount));
  }
  $('btn-start').addEventListener('click', () => { ui.openPalette = -1; showScreen('setup'); });

  /* ================= إعداد اللاعبين ================= */
  function renderSetup() {
    const ps = ui.setupPlayers;
    $('roster').innerHTML = ps.map((p, i) => {
      const others = ps.filter((_, j) => j !== i).map((q) => q.color);
      const open = ui.openPalette === i;
      const palette = !open ? '' : `
        <div class="palette" role="group" aria-label="ألوان ${esc(p.name)}">
          ${E.PALETTE.map((c) => `<button class="palette__swatch gem" data-action="pick" data-color="${c}"
              style="background-color:${c}" aria-label="اللون ${c}"
              aria-pressed="${c.toLowerCase() === p.color.toLowerCase()}"
              ${E.isColorTooClose(c, others) && c.toLowerCase() !== p.color.toLowerCase() ? 'disabled' : ''}></button>`).join('')}
          <label class="palette__custom"><input type="color" data-action="custom" value="${p.color}">لون آخر</label>
        </div>`;
      return `
        <div class="prow" data-i="${i}">
          <div class="prow__main">
            <button class="swatch-btn gem" data-action="palette" style="background-color:${p.color}"
              aria-expanded="${open}" aria-label="تغيير لون اللاعب ${i + 1}"></button>
            <input class="prow__name" data-action="name" value="${esc(p.name)}"
              maxlength="${E.CONFIG.MAX_NAME_LENGTH}" aria-label="اسم اللاعب ${i + 1}" autocomplete="off">
          </div>
          ${palette}
          <p class="prow__error" hidden></p>
        </div>`;
    }).join('');
    renderSetupValidation();
  }

  // تحديث رسائل الأخطاء فقط (دون إعادة بناء الحقول حتى لا يضيع التركيز)
  function renderSetupValidation() {
    const errors = E.validatePlayers(ui.setupPlayers);
    document.querySelectorAll('#roster .prow').forEach((row) => {
      const i = Number(row.dataset.i);
      const err = errors.find((e) => e.index === i);
      row.classList.toggle('has-error', Boolean(err));
      const p = row.querySelector('.prow__error');
      p.hidden = !err;
      p.textContent = err ? err.message : '';
    });
    const n = new Set(errors.map((e) => e.index)).size;
    $('setup-summary').textContent = n ? (n === 1 ? 'صحّح بيانات لاعب واحد للمتابعة' : 'صحّح بيانات ' + n + ' لاعبين للمتابعة') : '';
    $('btn-play').disabled = errors.length > 0;
  }

  $('roster').addEventListener('click', (e) => {
    const t = e.target.closest('[data-action]');
    if (!t) return;
    const i = Number(t.closest('.prow').dataset.i);
    if (t.dataset.action === 'palette') {
      ui.openPalette = ui.openPalette === i ? -1 : i;
      renderSetup();
    } else if (t.dataset.action === 'pick') {
      ui.setupPlayers[i] = { ...ui.setupPlayers[i], color: t.dataset.color };
      ui.openPalette = -1;
      renderSetup();
    }
  });
  $('roster').addEventListener('input', (e) => {
    const t = e.target;
    const row = t.closest('.prow');
    if (!row) return;
    const i = Number(row.dataset.i);
    if (t.dataset.action === 'name') {
      ui.setupPlayers[i] = { ...ui.setupPlayers[i], name: t.value };
    } else if (t.dataset.action === 'custom') {
      ui.setupPlayers[i] = { ...ui.setupPlayers[i], color: t.value.toUpperCase() };
      row.querySelector('.swatch-btn').style.backgroundColor = t.value;
    }
    renderSetupValidation();
  });
  $('btn-setup-back').addEventListener('click', () => showScreen('start'));
  $('btn-play').addEventListener('click', () => {
    if (E.validatePlayers(ui.setupPlayers).length) return;
    startNewGame(E.createGame(ui.setupPlayers));
  });

  /* ================= اللعب ================= */
  function startNewGame(game) {
    ui.game = game;
    ui.pendingIndex = null;
    ui.hoverIndex = null;
    ui.notice = null;
    ui.captured = [];
    buildBoard();
    showScreen('game');
  }

  const colorOf = (id) => (E.getPlayer(ui.game, id) || {}).color;

  // يختار الكحلي أو الأبيض حسب أعلى تباين مع لون الخلفية
  function textOn(hex) {
    const c = E.hexToRgb(hex);
    if (!c) return '#FFFFFF';
    const lin = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
    const L = 0.2126 * lin(c.r) + 0.7152 * lin(c.g) + 0.0722 * lin(c.b);
    const navyL = 0.0137; // #0A1F3B
    return (L + 0.05) / (navyL + 0.05) >= 1.05 / (L + 0.05) ? '#0A1F3B' : '#FFFFFF';
  }

  // تُبنى خلايا الشبكة مرة واحدة لكل لعبة، ثم تُحدَّث خصائصها فقط
  function buildBoard() {
    const board = $('board');
    const n = ui.game.gridSize;
    board.style.setProperty('--n', n);
    board.innerHTML = '';
    for (let i = 0; i < n * n; i++) {
      const c = document.createElement('button');
      c.className = 'cell';
      c.dataset.index = i;
      c.setAttribute('role', 'gridcell');
      c.setAttribute('aria-label', 'المربع ' + (i + 1));
      c.innerHTML = '<span class="cell__num">' + (i + 1) + '</span>';
      c.addEventListener('animationend', () => c.classList.remove('is-captured'));
      board.appendChild(c);
    }
  }

  function renderGame() {
    if (!ui.game) return;
    renderTopbar();
    renderPlayers();
    renderControls();
    renderBoard();
  }

  function renderTopbar() {
    const g = ui.game;
    const active = E.getPlayer(g, g.activePlayerId);
    $('info-count').textContent = g.players.length;
    $('info-active').innerHTML = active
      ? `اللاعب النشط: <span class="diamond" style="background:${active.color}"></span><strong>${esc(active.name)}</strong>`
      : 'اللاعب النشط: <strong>لم يُحدَّد</strong>';
  }

  function renderPlayers() {
    const g = ui.game;
    $('players').innerHTML = g.players.map((p) => {
      const on = p.id === g.activePlayerId;
      return `
        <button class="pcard ${on ? 'is-active' : ''}" data-player="${p.id}" style="--pc:${p.color}" aria-pressed="${on}">
          <span class="pcard__swatch gem" style="background-color:${p.color}"></span>
          <span class="pcard__text">
            <span class="pcard__name">${esc(p.name)}</span>
            <span class="pcard__squares">${squaresText(E.countOwned(g, p.id))}</span>
          </span>
          <span class="pcard__score num">${g.scores[p.id]}<small>نقاط</small></span>
        </button>`;
    }).join('');
  }

  function renderControls() {
    const g = ui.game;
    const active = E.getPlayer(g, g.activePlayerId);
    const status = $('status');
    let text, type = '';

    let guide;
    const full = E.countSelectable(g) === 0;
    if (full) guide = 'امتلأت الشبكة. اضغط «إنهاء اللعبة» لعرض النتائج';
    else if (!active) guide = 'اضغط على اسم اللاعب الذي أجاب إجابة صحيحة';
    else if (!g.moveArmed) guide = `اضغط «إجابة صحيحة» لتفعيل حركة ${esc(active.name)}`;
    else if (ui.pendingIndex === null) guide = `اختر مربعًا لصالح ${esc(active.name)}`;
    else guide = `المربع ${ui.pendingIndex + 1}: اضغط «تأكيد الحركة» أو المربع نفسه مرة ثانية`;

    if (!ui.notice) text = guide;
    else if (full && ui.notice.type !== 'warn') { type = ui.notice.type; text = ui.notice.text + '. ' + guide; }
    else {
      type = ui.notice.type;
      text = ui.notice.withGuide ? ui.notice.text + '. ' + guide : ui.notice.text;
    }

    const gem = active ? `<span class="diamond" style="background:${active.color}"></span>` : '';
    status.className = 'status' + (type === 'ok' ? ' is-ok' : type === 'warn' ? ' is-warn' : '');
    status.innerHTML = gem + '<span>' + text + '</span>';

    $('btn-correct').hidden = g.moveArmed;
    $('btn-correct').disabled = !active || E.countSelectable(g) === 0;
    $('btn-cancel').hidden = !g.moveArmed;
    $('btn-confirm').disabled = !(g.moveArmed && ui.pendingIndex !== null);
    $('btn-undo').disabled = g.moveHistory.length === 0;
  }

  function renderBoard() {
    const g = ui.game;
    const board = $('board');
    const active = E.getPlayer(g, g.activePlayerId);
    board.classList.toggle('is-armed', g.moveArmed);
    board.classList.toggle('is-pending', g.moveArmed && ui.pendingIndex !== null);
    board.style.setProperty('--pc', active ? active.color : 'transparent');
    board.style.setProperty('--ptc', active ? textOn(active.color) : '#FFFFFF');

    // المعاينة: المربع المثبّت أولًا، وإلا المربع تحت المؤشر
    const target = g.moveArmed ? (ui.pendingIndex !== null ? ui.pendingIndex : ui.hoverIndex) : null;
    const preview = new Map();
    if (target !== null) for (const c of E.previewMove(g, target)) preview.set(c.index, c);

    const cells = board.children;
    for (let i = 0; i < cells.length; i++) {
      const cell = cells[i];
      const owner = g.board[i];
      const pv = preview.get(i);
      cell.classList.toggle('is-owned', owner !== null);
      cell.classList.toggle('gem', owner !== null || Boolean(pv));
      cell.style.setProperty('--oc', owner !== null ? colorOf(owner) : 'transparent');
      cell.setAttribute('aria-label', 'المربع ' + (i + 1) + (owner !== null ? '، ' + E.getPlayer(g, owner).name + '، غير متاح' : ''));
      cell.classList.toggle('is-preview', Boolean(pv && pv.changes));
      cell.classList.toggle('is-same', Boolean(pv && !pv.changes));
      cell.classList.toggle('is-target', i === target);
      cell.setAttribute('aria-disabled', String(!g.moveArmed));
    }

    // حركة الاستحواذ: المربع المختار أولًا ثم المجاورات
    ui.captured.forEach((i, k) => {
      const cell = cells[i];
      cell.classList.remove('is-captured');
      void cell.offsetWidth; // إعادة تشغيل الحركة
      cell.style.animationDelay = (k === 0 ? 0 : 90) + 'ms';
      cell.classList.add('is-captured');
    });
    ui.captured = [];
  }

  function setNotice(type, text) {
    ui.notice = { type, text };
    renderControls();
    if (type === 'warn') {
      const s = $('status');
      s.classList.remove('nudge');
      void s.offsetWidth;
      s.classList.add('nudge');
    }
  }

  /* ---------- أحداث اللعب ---------- */

  // اختيار لاعب: حر ومباشر، بلا ترتيب أدوار
  $('players').addEventListener('click', (e) => {
    const card = e.target.closest('[data-player]');
    if (!card) return;
    const before = ui.game.activePlayerId;
    ui.game = E.selectPlayer(ui.game, card.dataset.player);
    if (ui.game.activePlayerId !== before) {
      ui.pendingIndex = null;
      ui.hoverIndex = null;
    }
    ui.notice = null;
    renderGame();
  });

  $('btn-correct').addEventListener('click', () => {
    ui.game = E.markCorrectAnswer(ui.game);
    ui.notice = null;
    renderGame();
    if (isNarrow()) $('controls').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  $('btn-cancel').addEventListener('click', () => {
    ui.game = E.cancelMove(ui.game);
    ui.pendingIndex = null;
    ui.hoverIndex = null;
    ui.notice = null;
    renderGame();
  });

  $('btn-confirm').addEventListener('click', confirmMove);

  $('btn-undo').addEventListener('click', () => {
    if (!ui.game.moveHistory.length) return;
    ui.game = E.undo(ui.game);
    ui.pendingIndex = null;
    ui.hoverIndex = null;
    ui.notice = { type: 'info', text: 'تم التراجع عن آخر حركة', withGuide: true };
    renderGame();
  });

  function confirmMove() {
    const g = ui.game;
    if (ui.pendingIndex === null) return;
    const res = E.applyMove(g, ui.pendingIndex);
    if (!res.applied) return;
    const mover = E.getPlayer(g, g.activePlayerId);
    ui.game = res.state;
    const changed = res.changed.map((c) => c.index);
    // المربع المختار أول الحركة إن تغيّر
    ui.captured = changed.includes(ui.pendingIndex) ? [ui.pendingIndex, ...changed.filter((i) => i !== ui.pendingIndex)] : changed;
    ui.pendingIndex = null;
    ui.hoverIndex = null;
    ui.notice = changed.length
      ? { type: 'ok', text: `استحواذ على ${capturedText(changed.length)} لصالح ${esc(mover.name)}` }
      : { type: 'info', text: `هذه المربعات ملك ${esc(mover.name)} أصلًا، لم تتغير النقاط` };
    renderGame();
  }

  $('board').addEventListener('click', (e) => {
    const cell = e.target.closest('[data-index]');
    if (!cell) return;
    const i = Number(cell.dataset.index);
    const g = ui.game;
    if (!g.activePlayerId) return setNotice('warn', 'اختر أولًا اللاعب الذي أجاب إجابة صحيحة');
    if (!g.moveArmed) return setNotice('warn', 'اضغط «إجابة صحيحة» أولًا لتفعيل الحركة');
    if (!E.isSelectable(g, i)) return setNotice('warn', 'لا يمكن اختيار مربع ملوّن. اختر مربعًا مرقّمًا');
    if (ui.pendingIndex === i) return confirmMove(); // الضغط مرتين = تأكيد
    ui.pendingIndex = i;
    ui.notice = null;
    renderControls();
    renderBoard();
  });

  if (canHover) {
    $('board').addEventListener('mouseover', (e) => {
      const cell = e.target.closest('[data-index]');
      if (!cell || !ui.game.moveArmed || ui.pendingIndex !== null) return;
      const i = Number(cell.dataset.index);
      if (!E.isSelectable(ui.game, i)) { if (ui.hoverIndex !== null) { ui.hoverIndex = null; renderBoard(); } return; }
      if (ui.hoverIndex !== i) { ui.hoverIndex = i; renderBoard(); }
    });
    $('board').addEventListener('mouseleave', () => {
      if (ui.hoverIndex !== null) { ui.hoverIndex = null; renderBoard(); }
    });
  }

  $('btn-reset').addEventListener('click', () => openModal({
    title: 'إعادة اللعبة؟',
    text: 'ستُمسح الشبكة والنقاط وسجل الحركات، ويبقى اللاعبون وألوانهم.',
    ok: 'إعادة اللعبة', danger: true,
    onConfirm: () => startNewGame(E.resetGame(ui.game)),
  }));

  $('btn-end').addEventListener('click', () => openModal({
    title: 'إنهاء اللعبة؟',
    text: 'ستظهر النتائج النهائية ولن تتمكن من متابعة هذه اللعبة.',
    ok: 'إنهاء وعرض النتائج', danger: false,
    onConfirm: () => showScreen('results'),
  }));

  /* ================= النتائج ================= */
  function renderResults() {
    const g = ui.game;
    const { rows, winners } = E.getRanking(g);
    const total = g.board.length;
    const max = Math.max(1, ...rows.map((r) => r.score));

    if (winners.length === 1) {
      $('results-title').textContent = `ألف مبروك، ${winners[0].name}!`;
      $('results-sub').innerHTML = `صدارة مستحقة: <b>${pointsText(winners[0].score)}</b> من أصل ${total} مربع. هكذا تُصقل المواهب 💎`;
    } else if (winners.length > 1) {
      $('results-title').textContent = 'تعادل في الصدارة!';
      $('results-sub').innerHTML = `${esc(joinNames(winners.map((w) => w.name)))}، لكلٍّ منهم <b>${pointsText(winners[0].score)}</b>. هكذا تُصقل المواهب 💎`;
    } else {
      $('results-title').textContent = 'انتهت اللعبة';
      $('results-sub').textContent = 'لم يستحوذ أحد على أي مربع.';
    }

    $('rank').innerHTML = rows.map((r) => {
      const win = winners.some((w) => w.id === r.id);
      return `
        <li class="rank__row ${win ? 'is-winner' : ''}" style="--pc:${r.color}">
          <span class="rank__pos num">${r.rank}</span>
          <span class="rank__swatch gem" style="background-color:${r.color}"></span>
          <span style="min-width:0">
            <span class="rank__name" style="display:block">${esc(r.name)}</span>
            <span class="rank__meta">${squaresText(r.squares)}</span>
            <span class="rank__bar" style="display:block"><span class="rank__fill" style="display:block;width:${(r.score / max) * 100}%"></span></span>
          </span>
          <span class="rank__score num">${r.score}<small>نقاط</small></span>
        </li>`;
    }).join('');
  }

  $('btn-again').addEventListener('click', () => startNewGame(E.resetGame(ui.game)));
  $('btn-home').addEventListener('click', () => {
    ui.setupPlayers = ui.game.players.map((p) => ({ ...p }));
    ui.playerCount = ui.setupPlayers.length;
    ui.game = null;
    showScreen('start');
  });

  /* ================= نافذة التأكيد ================= */
  let lastFocus = null;
  function openModal({ title, text, ok, danger, onConfirm }) {
    lastFocus = document.activeElement;
    $('modal-title').textContent = title;
    $('modal-text').textContent = text;
    const okBtn = $('modal-ok');
    okBtn.textContent = ok;
    okBtn.className = 'btn ' + (danger ? 'btn--solid-danger' : 'btn--warm');
    ui.modalConfirm = onConfirm;
    $('modal').classList.add('is-on');
    $('modal-cancel').focus();
  }
  function closeModal() {
    $('modal').classList.remove('is-on');
    ui.modalConfirm = null;
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  }
  $('modal-ok').addEventListener('click', () => { const fn = ui.modalConfirm; closeModal(); if (fn) fn(); });
  $('modal-cancel').addEventListener('click', closeModal);
  $('modal').addEventListener('click', (e) => { if (e.target === $('modal')) closeModal(); });

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if ($('modal').classList.contains('is-on')) return closeModal();
    if (ui.screen === 'game' && ui.pendingIndex !== null) { ui.pendingIndex = null; renderGame(); }
  });

  // حماية من إغلاق الصفحة أو تحديثها بالخطأ أثناء لعبة فيها حركات
  window.addEventListener('beforeunload', (e) => {
    if (ui.screen === 'game' && ui.game && ui.game.moveHistory.length) { e.preventDefault(); e.returnValue = ''; }
  });

  // للاختبار الآلي فقط
  window.__tarabee = { ui, E };

  renderStart();
})();
</script>
</body>
</html>
