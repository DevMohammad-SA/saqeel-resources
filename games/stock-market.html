<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سوق أسهم صقيل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1B4785; --blue:#298DCB; --sky:#78BFE2; --sky-l:#81D4F0; --deep:#0A4385;
  --ink:#12233D; --bg:#EEF3F8; --amber:#F2A63B;
  --surface:#ffffff; --line:#d7e2ee; --muted:#5b6b82;
  --up:#1f9d55; --up-bg:#e3f6ea; --down:#d64545; --down-bg:#fbe6e6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e8eef7; --bg:#0c1a2e; --surface:#13263f; --line:#24405f; --muted:#9fb2cc;
    --up-bg:#123a26; --down-bg:#3d1a1d; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#e8eef7; --bg:#0c1a2e; --surface:#13263f; --line:#24405f; --muted:#9fb2cc;
  --up-bg:#123a26; --down-bg:#3d1a1d; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:"Tajawal","Cairo",system-ui,"Segoe UI",Tahoma,sans-serif;
  font-size:17px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button,input{font-family:inherit; color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--amber); outline-offset:2px}
.num{font-variant-numeric:tabular-nums; direction:ltr; unicode-bidi:isolate; display:inline-block}

/* ===== Header ===== */
.top{
  display:flex; align-items:center; gap:16px; padding:10px 22px;
  background:var(--surface); border-bottom:1px solid var(--line);
}
.tick-mark{display:inline-flex; align-items:flex-end; gap:3px; height:26px}
.tick-mark i{width:5px; border-radius:2px; background:var(--sky)}
.tick-mark i:nth-child(1){height:9px}
.tick-mark i:nth-child(2){height:16px; background:var(--blue)}
.tick-mark i:nth-child(3){height:12px; background:var(--sky-l)}
.tick-mark i:nth-child(4){height:24px; background:var(--amber)}
.tape{background:var(--deep); color:#fff; overflow:hidden; white-space:nowrap; border-bottom:2px solid var(--amber)}
.tape:empty{display:none}
.tape .run{display:inline-flex; animation:tape 38s linear infinite; will-change:transform}
.tape:hover .run{animation-play-state:paused}
.tape .it{display:inline-flex; align-items:center; gap:8px; padding:7px 16px; font-size:.95rem; font-weight:700; border-inline-end:1px solid rgba(255,255,255,.12)}
.tape .it .p{font-weight:900}
.tape .it .d{font-weight:800; font-size:.88rem}
.tape .it .d.up{color:#6ee7a8}
.tape .it .d.down{color:#ff9d9d}
.tape .it .d.flat{color:#9fc3e0}
@keyframes tape{from{transform:translateX(0)} to{transform:translateX(50%)}}
@media (prefers-reduced-motion: reduce){ .tape .run{animation:none} }
.spark{display:block; width:100%; height:26px; margin-top:2px}
.spark path{fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
.spark .area{stroke:none; opacity:.14}
.logo-chip{background:#fff; border-radius:10px; padding:4px 8px; display:flex; align-items:center}
.logo-chip img{height:46px; width:auto; display:block}
.top h1{margin:0; font-size:1.45rem; font-weight:900; color:var(--navy); letter-spacing:0}
:root[data-theme="dark"] .top h1{color:var(--sky-l)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .top h1{color:var(--sky-l)}}
.top .spacer{flex:1}
.round-pill{
  background:var(--navy); color:#fff; border-radius:999px; padding:6px 16px; font-weight:800; font-size:1rem;
}
.tbtn{
  border:1.5px solid var(--line); background:transparent; border-radius:12px; padding:8px 14px;
  font-weight:700; font-size:.95rem; display:inline-flex; align-items:center; gap:6px;
}
.tbtn:hover{border-color:var(--blue)}
.tbtn.danger{border-color:#e7b3b3; color:var(--down)}
.tbtn.danger:hover{background:var(--down-bg)}

/* ===== Layout ===== */
.wrap{padding:18px 22px 24px}
.game{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:18px; align-items:start}
@media (max-width:980px){ .game{grid-template-columns:1fr} }

/* ===== Buttons ===== */
.btn{
  border:0; border-radius:16px; padding:16px 28px; font-size:1.25rem; font-weight:800;
  background:var(--navy); color:#fff; transition:transform .12s ease, filter .12s ease;
}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.4}
.btn.amber{background:var(--amber); color:#2a1a00}
.btn.ghost{background:transparent; color:var(--ink); border:2px solid var(--line)}
.btn.big{font-size:1.6rem; padding:22px 36px; border-radius:20px}

/* ===== Setup ===== */
.setup{max-width:880px; margin:0 auto}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:28px}
.setup h2{margin:0 0 6px; font-size:2rem; font-weight:900; color:var(--navy)}
:root[data-theme="dark"] .setup h2{color:var(--sky-l)}
.lead{color:var(--muted); margin:0 0 22px}
.count-row{display:flex; align-items:center; gap:14px; margin-bottom:22px; flex-wrap:wrap}
.count-row label{font-weight:800; font-size:1.15rem}
.stepper{display:inline-flex; align-items:center; border:2px solid var(--line); border-radius:14px; overflow:hidden}
.stepper button{width:52px; height:52px; border:0; background:var(--bg); font-size:1.6rem; font-weight:800}
.stepper button:disabled{opacity:.35}
.stepper input{width:70px; height:52px; border:0; text-align:center; font-size:1.5rem; font-weight:900; background:var(--surface)}
.names{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; margin-bottom:24px}
.name-field{display:flex; align-items:center; gap:8px; background:var(--bg); border-radius:12px; padding:6px 10px}
.name-field span{font-weight:800; color:var(--blue); min-width:24px; text-align:center}
.name-field input{flex:1; border:0; background:transparent; font-size:1.05rem; padding:8px 4px; font-weight:600; min-width:0}
.name-field input:focus{outline:none}
.name-field:focus-within{box-shadow:0 0 0 2px var(--blue)}
.setup-actions{display:flex; gap:12px; flex-wrap:wrap}
.how h4{margin:0 0 14px}
.how ol{margin:0 0 6px; padding-inline-start:22px; display:flex; flex-direction:column; gap:10px}
.how li{font-size:1.02rem}
.how li b{color:var(--navy)}
:root[data-theme="dark"] .how li b{color:var(--sky-l)}
.how .note{background:var(--bg); border-radius:12px; padding:10px 14px; margin-top:14px; font-size:.95rem; color:var(--muted)}
.modal.how{max-width:620px; max-height:82vh; overflow:auto}
.rules{display:flex; gap:10px; flex-wrap:wrap; margin:0 0 24px; padding:0; list-style:none}
.rules li{background:var(--bg); border-radius:10px; padding:8px 12px; font-size:.95rem}
.rules b{color:var(--navy)}
:root[data-theme="dark"] .rules b{color:var(--sky-l)}

/* ===== Stage (current group) ===== */
.stage{
  background:linear-gradient(160deg,var(--navy) 0%, var(--deep) 100%);
  color:#fff; border-radius:26px; padding:26px 30px; position:relative; overflow:hidden;
}
.stage::before{
  content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
  background-image:linear-gradient(to left, rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(to top, rgba(255,255,255,.05) 1px, transparent 1px);
  background-size:52px 52px;
}
.stage::after{ /* facet ornament echoing the diamond mark */
  content:""; position:absolute; inset-inline-start:-80px; bottom:-120px; width:320px; height:320px;
  background:conic-gradient(from 45deg, rgba(129,212,240,.20), rgba(41,141,203,.05), rgba(129,212,240,.16), rgba(41,141,203,.04));
  transform:rotate(45deg); border-radius:28px; pointer-events:none;
}
.stage > *{position:relative; z-index:1}
.meta{display:flex; gap:10px; flex-wrap:wrap; font-weight:700; color:var(--sky-l); font-size:1.15rem}
.meta .sep{opacity:.5}
.order-strip{display:flex; gap:6px; flex-wrap:wrap; margin-top:12px}
.order-strip span{font-size:.85rem; padding:3px 10px; border-radius:999px; background:rgba(255,255,255,.10); color:#cfe6f6}
.order-strip span.done{opacity:.45}
.order-strip span.now{background:var(--amber); color:#2a1a00; font-weight:800}
.team-name{font-size:clamp(2.6rem,6vw,4.6rem); font-weight:900; line-height:1.15; margin:18px 0 6px}
.bal-label{color:var(--sky); font-weight:700; font-size:1.1rem}
.bal{font-size:clamp(2rem,4.5vw,3.2rem); font-weight:900}
.bal small{font-size:.5em; font-weight:700; color:var(--sky-l); margin-inline-start:6px}
.answer-btns{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:26px}
.abtn{
  border:0; border-radius:22px; padding:26px 16px; font-size:clamp(1.4rem,2.6vw,2rem); font-weight:900;
  display:flex; align-items:center; justify-content:center; gap:12px; transition:transform .12s ease, filter .12s;
}
.abtn:active{transform:scale(.98)}
.abtn:hover{filter:brightness(1.07)}
.abtn.ok{background:#27b36a; color:#fff}
.abtn.no{background:#fff; color:var(--down)}
.abtn i{font-style:normal; font-size:1.3em; line-height:1}

.stage-enter{animation:stageIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes stageIn{from{opacity:0; transform:translateX(-40px)} to{opacity:1; transform:none}}

/* Reward */
.reward{text-align:center; padding:12px 0 4px}
.reward .label{font-size:1.5rem; font-weight:800; color:var(--sky-l)}
.reward .amount{
  font-size:clamp(4.2rem,11vw,8rem); font-weight:900; color:var(--amber); line-height:1.1; margin:6px 0;
  text-shadow:0 6px 30px rgba(242,166,59,.35);
}
.reward .amount.zero{color:#cfe0f0; text-shadow:none; font-size:clamp(2.4rem,6vw,4rem)}
.reward .newbal{font-size:1.3rem; color:#dcecf8}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6); opacity:0} to{transform:scale(1); opacity:1}}
.center-actions{display:flex; justify-content:center; margin-top:22px}

/* ===== Market ===== */
.mk-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap}
.mk-head .team-name{font-size:clamp(1.8rem,3.4vw,2.6rem); margin:4px 0 0}
.stage.mk{padding:18px 22px}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stats{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-top:10px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:rgba(255,255,255,.08); border-radius:16px; padding:8px 14px}
.stat .k{color:var(--sky); font-weight:700; font-size:.95rem}
.stat .v{font-size:1.7rem; font-weight:900}
.stat.hl{background:rgba(242,166,59,.16)}
.stat.hl .v{color:var(--amber)}
.moves-dots{display:none}
.moves-dots b{width:22px; height:22px; border-radius:6px; background:var(--amber); transform:rotate(45deg) scale(.8)}
.moves-dots b.used{background:rgba(255,255,255,.18)}

.market-area{margin-top:12px}
.cos{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px}
@media (max-width:1180px){.cos{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:760px){.cos{grid-template-columns:repeat(2,minmax(0,1fr))}}
.co{
  background:var(--surface); color:var(--ink); border:2px solid var(--line); border-radius:18px;
  padding:9px 11px 8px; text-align:start; display:flex; flex-direction:column; gap:2px;
  transition:border-color .12s, transform .12s;
}
.co:hover:not(:disabled){border-color:var(--blue)}
.co.lock{opacity:.55}
.co .lk{font-size:.78rem; font-weight:800; color:var(--amber); }
.co.sel{border-color:var(--amber); box-shadow:0 0 0 3px rgba(242,166,59,.35)}
.co .nm{font-weight:800; font-size:1.02rem; display:flex; align-items:center; gap:6px}
.co .ic{font-size:1.15rem}
.co .pr{font-size:1.45rem; font-weight:900; line-height:1.15}
.co .pr small{font-size:.55em; color:var(--muted); font-weight:700}
.chg{font-weight:800; font-size:.92rem; border-radius:8px; padding:1px 8px; align-self:flex-start}
.chg.up{color:var(--up); background:var(--up-bg)}
.chg.down{color:var(--down); background:var(--down-bg)}
.chg.flat{color:var(--muted); background:var(--bg)}
.co .own{font-size:.85rem; color:var(--muted); margin-top:3px; border-top:1px dashed var(--line); padding-top:5px}
.co .own b{color:var(--ink)}

.trade{
  margin-top:12px; background:var(--surface); color:var(--ink); border-radius:20px; padding:12px 18px;
  display:grid; grid-template-columns:minmax(0,1.2fr) auto minmax(0,1fr) auto; gap:18px; align-items:center;
}
@media (max-width:900px){.trade{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.trade{grid-template-columns:1fr}}
.trade .tco{font-size:1.4rem; font-weight:900}
.trade .tsub{color:var(--muted); font-size:.95rem}
.seg{display:inline-flex; background:var(--bg); border-radius:14px; padding:4px}
.seg button{border:0; background:transparent; padding:10px 22px; font-size:1.15rem; font-weight:800; border-radius:11px; color:var(--muted)}
.seg button.on.buy{background:var(--up); color:#fff}
.seg button.on.sell{background:var(--down); color:#fff}
.qty{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.qty .stepper input{width:84px}
.qty .max{border:0; background:var(--bg); border-radius:10px; padding:10px 12px; font-weight:800; font-size:.95rem}
.total .k{color:var(--muted); font-size:.95rem}
.total .v{font-size:1.6rem; font-weight:900}
.total .err{color:var(--down); font-weight:800; font-size:.95rem; min-height:1.4em}
.exec{min-width:170px}
.exec.buy{background:var(--up)}
.exec.sell{background:var(--down)}
.hint{margin-top:14px; background:rgba(255,255,255,.08); border-radius:16px; padding:14px 18px; font-weight:700; color:#dcecf8}
.mk-foot{display:flex; justify-content:flex-end; margin-top:16px}

/* ===== Market update ===== */
.upd-title{font-size:clamp(2.4rem,5vw,3.6rem); font-weight:900; text-align:center; margin:6px 0 4px}
.upd-sub{text-align:center; color:var(--sky-l); font-weight:700; margin-bottom:18px}
.upd-grid{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px}
@media (max-width:1000px){.upd-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.upd{background:var(--surface); color:var(--ink); border-radius:16px; padding:12px; opacity:0; animation:fadeUp .4s ease forwards}
.upd .nm{font-weight:800}
.upd .path{color:var(--muted); font-size:.95rem}
.upd .pr{font-size:1.6rem; font-weight:900}
@keyframes fadeUp{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none}}
.scan{height:6px; border-radius:6px; background:rgba(255,255,255,.12); overflow:hidden; margin:30px auto; max-width:420px}
.scan i{display:block; height:100%; width:40%; background:var(--amber); border-radius:6px; animation:scan 1s ease-in-out infinite alternate}
@keyframes scan{from{margin-inline-start:0} to{margin-inline-start:60%}}

/* ===== Leaderboard ===== */
.board{background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:18px 16px; position:sticky; top:14px}
.board h3{margin:0 0 10px; font-size:1.2rem; font-weight:900; display:flex; justify-content:space-between; align-items:baseline}
.board h3 small{font-size:.8rem; color:var(--muted); font-weight:600}
.board ol{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
.board li{display:grid; grid-template-columns:30px minmax(0,1fr) auto; gap:8px; align-items:center; padding:9px 10px; border-radius:12px; background:var(--bg)}
.board li .rk{font-weight:900; color:var(--blue); text-align:center}
.board li .tn{font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.board li .tw{font-weight:900}
.board li.cur{box-shadow:inset 0 0 0 2px var(--sky)}
.board li.cur .rk{background:var(--sky); color:#fff; border-radius:8px}
.board li.flash{animation:flash .9s ease}
@keyframes flash{0%{background:rgba(242,166,59,.45)}100%{background:var(--bg)}}

/* ===== Order & final ===== */
.order-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; margin:20px 0 26px; padding:0; list-style:none}
.order-list li{background:rgba(255,255,255,.1); border-radius:16px; padding:14px 16px; display:flex; gap:12px; align-items:center; font-size:1.3rem; font-weight:800; opacity:0; animation:fadeUp .35s ease forwards}
.order-list li b{background:var(--amber); color:#2a1a00; width:38px; height:38px; border-radius:10px; display:grid; place-items:center; flex:none}
.final{max-width:980px; margin:0 auto}
.winner{text-align:center; padding:34px 20px 30px}
.winner .cup{font-size:4.5rem; line-height:1}
.winner .lbl{color:var(--sky-l); font-weight:800; font-size:1.4rem; margin-top:6px}
.winner .wn{font-size:clamp(2.8rem,7vw,5.2rem); font-weight:900; line-height:1.15; margin:8px 0}
.winner .wb{font-size:clamp(2rem,4.5vw,3rem); font-weight:900; color:var(--amber)}
.ranking{margin-top:18px}
.ranking h3{font-size:1.4rem; margin:0 0 12px; font-weight:900}
.rk-row{display:grid; grid-template-columns:50px minmax(0,1fr) auto; gap:12px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 16px; margin-bottom:8px; font-size:1.2rem}
.rk-row .p{font-weight:900; color:var(--blue); font-size:1.4rem; text-align:center}
.rk-row .n{font-weight:800}
.rk-row .n small{display:block; font-size:.8rem; color:var(--muted); font-weight:600}
.rk-row .b{font-weight:900; font-size:1.4rem}

/* ===== Modal & toasts ===== */
.modal-bg{position:fixed; inset:0; background:rgba(10,20,40,.55); display:grid; place-items:center; z-index:50; padding:20px; animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface); color:var(--ink); border-radius:22px; padding:28px; max-width:520px; width:100%; animation:pop .3s cubic-bezier(.2,1.3,.4,1)}
.modal h4{margin:0 0 10px; font-size:1.5rem; font-weight:900}
.modal p{margin:0 0 22px; color:var(--muted); font-size:1.1rem}
.modal .acts{display:flex; gap:10px; justify-content:flex-start; flex-wrap:wrap}
.modal .btn{font-size:1.1rem; padding:13px 22px}
.btn.red{background:var(--down)}
.toasts{position:fixed; bottom:calc(20px + env(safe-area-inset-bottom,0px)); left:20px; display:flex; flex-direction:column; gap:8px; z-index:60}
.toast{background:var(--ink); color:var(--surface); padding:12px 18px; border-radius:14px; font-weight:700; box-shadow:0 8px 24px rgba(0,0,0,.18); animation:tin .25s ease}
.toast.ok{background:var(--up); color:#fff}
.toast.err{background:var(--down); color:#fff}
@keyframes tin{from{opacity:0; transform:translateY(10px)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition:none !important}
  .upd,.order-list li{opacity:1}
}
@media (max-width:640px){
  .top{padding:8px 12px; gap:8px; flex-wrap:wrap}
  .top h1{font-size:1.1rem}
  .logo-chip img{height:34px}
  .wrap{padding:12px}
  .stage{padding:18px}
  .answer-btns{grid-template-columns:1fr}
  .tbtn .lbl{display:none}
}
</style>
</head>

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function clearSave(){ try{ localStorage.removeItem(KEY); }catch(e){} }

function newGame(names){
  const teams = shuffle(names).map((n,i) => ({id:"t"+i, name:n, cash:START_CASH, holdings:{}}));
  S = {
    v:1, phase:"order", round:1, cur:0, movesLeft:MAX_MOVES, lastReward:null, lastChanges:null, final:null,
    teams,
    companies: COMPANIES.map(c => ({id:c.id, price:c.price, base:c.price, prev:c.price, lastR:0, hist:[c.price]})),
  };
  save();
}
const priceOf = id => S.companies.find(c => c.id === id).price;
function stockValue(t){ let v=0; for(const id in t.holdings) v += t.holdings[id]*priceOf(id); return v; }
const wealth = t => t.cash + stockValue(t);
const curTeam = () => S.teams[S.cur];

const REWARD_MIN = 50, REWARD_MAX = 350, REWARD_STEP = 10;
function randomReward(){ // من 50 إلى 350 بمضاعفات 10
  const n = (REWARD_MAX - REWARD_MIN)/REWARD_STEP + 1;
  return REWARD_MIN + REWARD_STEP*Math.floor(Math.random()*n);
}

function answer(correct){
  if(S.phase !== "question") return;
  const t = curTeam();
  const amt = correct ? randomReward() : 0;
  t.cash += amt;
  S.lastReward = {correct, amt, before:t.cash-amt};
  S.phase = "reward";
  save();
}
function toMarket(){
  if(S.phase !== "reward") return;
  S.phase = "market"; S.movesLeft = MAX_MOVES; S.traded = []; save();
}
/* أثر التداول الفوري: كل 400 ريال تداول تحرك السهم 1% (حد أقصى 5%)، وحركة لا تقل عن ريال واحد.
   تُنفَّذ العملية بالسعر بعد الأثر، حتى لا تربح المجموعة من حركة سهم صنعتها بنفسها. */
const IMPACT_PER = 400, IMPACT_MAX = 0.05;
function impactPrice(id, qty, side){
  const c = S.companies.find(x=>x.id===id), p = c.price;
  const pct = Math.min(IMPACT_MAX, (p*qty)/IMPACT_PER/100);
  const d = Math.max(1, Math.round(p*pct));
  const lo = Math.round(c.base*0.55), hi = Math.round(c.base*1.6);
  return clamp(side==="buy" ? p+d : p-d, lo, hi);
}
const tradedNow = id => (S.traded||[]).includes(id);
function applyTrade(id, np){
  const c = S.companies.find(x=>x.id===id);
  c.price = np; (S.traded = S.traded||[]).push(id);
}
function buy(id, qty){
  qty = Math.floor(qty);
  if(S.phase!=="market") return {ok:false, msg:"التداول متاح في مرحلة السوق فقط"};
  if(S.movesLeft<=0) return {ok:false, msg:"انتهت الحركات المتاحة لهذا الدور"};
  if(!(qty>=1)) return {ok:false, msg:"حدد عدد أسهم صحيحًا"};
  if(tradedNow(id)) return {ok:false, msg:"لا يمكن تنفيذ حركتين على السهم نفسه في الدورة"};
  const t = curTeam(), from = priceOf(id), np = impactPrice(id, qty, "buy"), cost = np*qty;
  if(cost > t.cash) return {ok:false, msg:"الرصيد غير كافٍ لإتمام العملية"};
  t.cash -= cost; t.holdings[id] = (t.holdings[id]||0) + qty; applyTrade(id, np); S.movesLeft--; save();
  return {ok:true, cost, from, to:np};
}
function sell(id, qty){
  qty = Math.floor(qty);
  if(S.phase!=="market") return {ok:false, msg:"التداول متاح في مرحلة السوق فقط"};
  if(S.movesLeft<=0) return {ok:false, msg:"انتهت الحركات المتاحة لهذا الدور"};
  if(!(qty>=1)) return {ok:false, msg:"حدد عدد أسهم صحيحًا"};
  const t = curTeam(), have = t.holdings[id]||0;
  if(have<=0) return {ok:false, msg:"لا تملك المجموعة أسهمًا في هذه الشركة"};
  if(qty>have) return {ok:false, msg:"الكمية أكبر مما تملكه المجموعة ("+have+" سهم)"};
  if(tradedNow(id)) return {ok:false, msg:"لا يمكن تنفيذ حركتين على السهم نفسه في الدورة"};
  const from = priceOf(id), np = impactPrice(id, qty, "sell"), rev = np*qty;
  t.cash += rev; t.holdings[id] = have-qty; if(!t.holdings[id]) delete t.holdings[id]; applyTrade(id, np); S.movesLeft--; save();
  return {ok:true, rev, from, to:np};
}
function endTurn(){
  if(S.phase!=="market") return;
  if(S.cur < S.teams.length-1){ S.cur++; S.phase="question"; S.lastReward=null; }
  else { updateMarket(); S.phase="marketUpdate"; }
  save();
}
/* تحديث السوق: ضوضاء صغيرة + زخم محدود + عودة للمتوسط + عامل سوق عام ضعيف + حدود */
function updateMarket(){
  const mkt = gauss()*0.005;
  const rs = S.companies.map(c => {
    const dev = (c.price - c.base)/c.base;
    let r = 0.30*c.lastR - 0.15*dev + mkt + gauss()*0.017;
    return clamp(r, -0.05, 0.05);
  });
  // لا تتحرك كل الشركات في اتجاه واحد
  if(rs.every(r=>r>=0) || rs.every(r=>r<=0)){
    let k=0; rs.forEach((r,i)=>{ if(Math.abs(r)<Math.abs(rs[k])) k=i; });
    rs[k] = -(rs[k] || 0.01);
  }
  S.lastChanges = S.companies.map((c,i) => {
    const lo = Math.round(c.base*0.55), hi = Math.round(c.base*1.6);
    let np = Math.round(c.price*(1+rs[i]));
    // الأسعار بالريال الصحيح: لا نبتلع الحركة الحقيقية بالتقريب
    if(np===c.price && Math.abs(rs[i])>=0.003) np += rs[i]>0 ? 1 : -1;
    np = clamp(np, lo, hi);
    // ضمان عدم تجاوز 5% بعد التقريب
    const maxStep = Math.floor(c.price*0.05);
    np = clamp(np, c.price-maxStep, c.price+maxStep);
    const ch = {id:c.id, from:c.price, to:np};
    c.prev = c.price; c.lastR = (np - c.price)/c.price; c.price = np; c.hist.push(np);
    return ch;
  });
}
function startNextRound(){
  if(S.phase!=="marketUpdate") return;
  S.round++; S.cur=0; S.phase="question"; S.lastReward=null; save();
}
function finishGame(){
  const rows = S.teams.map(t => {
    const sv = stockValue(t);
    return {name:t.name, cashBefore:t.cash, stocks:sv, total:t.cash+sv};
  });
  // تصفية جميع المحافظ بالسعر الحالي
  S.teams.forEach(t => { t.cash += stockValue(t); t.holdings = {}; });
  rows.sort((a,b)=>b.total-a.total);
  S.final = rows; S.phase = "finished"; save();
}
function ranking(){ return S.teams.map((t,i)=>({t, i, w:t.cash})).sort((a,b)=>b.w-a.w || a.i-b.i); }

const app = document.getElementById("app");

function toast(msg, type=""){
  const el = document.createElement("div"); el.className = "toast "+type; el.textContent = msg;
  document.getElementById("toasts").appendChild(el);
  setTimeout(()=>{ el.style.transition="opacity .3s"; el.style.opacity="0"; setTimeout(()=>el.remove(),300); }, 2600);
}
function modal({title, text, okText, okClass="red", onOk, cancelText="إلغاء"}){
  const root = document.getElementById("modalRoot");
  root.innerHTML = `<div class="modal-bg" role="dialog" aria-modal="true"><div class="modal">
    <h4>${esc(title)}</h4><p>${text}</p>
    <div class="acts"><button class="btn ${okClass}" id="mOk">${esc(okText)}</button><button class="btn ghost" id="mNo">${esc(cancelText)}</button></div></div></div>`;
  const close = () => root.innerHTML = "";
  root.querySelector("#mNo").onclick = close;
  root.querySelector(".modal-bg").onclick = e => { if(e.target.classList.contains("modal-bg")) close(); };
  root.querySelector("#mOk").onclick = () => { close(); onOk(); };
  root.querySelector("#mNo").focus();
}
function countUp(el, from, to, ms=900){
  if(!el) return;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){ el.textContent = fmt(to); return; }
  const t0 = performance.now();
  const step = now => { const p = Math.min(1,(now-t0)/ms), e = 1-Math.pow(1-p,3);
    el.textContent = fmt(from + (to-from)*e); if(p<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
const RIYAL = `<small>ريال</small>`;
function chgBadge(from, to){
  if(from===to) return `<span class="chg flat"><span class="num">0.0%</span></span>`;
  const p = (to-from)/from*100, up = p>0;
  return `<span class="chg ${up?"up":"down"}">${up?"↑":"↓"} <span class="num">${up?"+":"−"}${Math.abs(p).toFixed(1)}%</span></span>`;
}

function sparkline(c){
  const last = c.hist[c.hist.length-1];
  const pts = c.price===last ? c.hist.slice() : c.hist.concat([c.price]);
  if(pts.length<2) return `<svg class="spark" viewBox="0 0 100 26" preserveAspectRatio="none" aria-hidden="true"><path d="M0 13 L100 13" style="stroke:var(--line)"></path></svg>`;
  const mn = Math.min(...pts), mx = Math.max(...pts), rg = (mx-mn)||1;
  const x = i => (i/(pts.length-1))*100, y = v => 24 - ((v-mn)/rg)*22;
  const d = pts.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(" ");
  const up = pts[pts.length-1] >= pts[0], col = up ? "var(--up)" : "var(--down)";
  return `<svg class="spark" viewBox="0 0 100 26" preserveAspectRatio="none" aria-hidden="true">
    <path class="area" d="${d} L100 26 L0 26 Z" style="fill:${col}"></path>
    <path d="${d}" style="stroke:${col}"></path></svg>`;
}
function renderTape(){
  const el = document.getElementById("tape");
  if(S && S.phase==="finished"){ el.innerHTML = ""; return; }
  const list = S ? S.companies : COMPANIES.map(c => ({id:c.id, price:c.price, prev:c.price}));
  const items = list.map(c => {
    const meta = COMPANIES.find(x=>x.id===c.id), diff = c.price - c.prev;
    const cls = diff>0?"up":diff<0?"down":"flat", sign = diff>0?"▲":diff<0?"▼":"■";
    const pct = c.prev ? (diff/c.prev*100) : 0;
    return `<span class="it"><span>${meta.ic} ${meta.name}</span><span class="p num">${fmt(c.price)}</span><span class="d ${cls}">${sign} <span class="num">${pct>0?"+":pct<0?"−":""}${Math.abs(pct).toFixed(1)}%</span></span></span>`;
  }).join("");
  el.innerHTML = `<div class="run">${items}${items}</div>`;
}
function render(){
  const inGame = S && ["order","question","reward","market","marketUpdate"].includes(S.phase);
  endBtn.hidden = !inGame;
  roundPill.innerHTML = inGame && S.phase!=="order" ? `<span class="round-pill">الدورة <span class="num">${S.round}</span></span>` : "";
  renderTape();
  if(!S || S.phase==="setup") return renderSetup();
  if(S.phase==="order") return renderOrder();
  if(S.phase==="finished") return renderFinal();
  renderGame();
}

function renderSetup(){

  while(UI.setupNames.length < n) UI.setupNames.push("");
  let fields = "";
  for(let i=0;i<n;i++) fields += `<label class="name-field"><span class="num">${i+1}</span><input data-i="${i}" maxlength="30" placeholder="المجموعة ${i+1}" value="${esc(UI.setupNames[i])}"></label>`;
  app.innerHTML = `<section class="setup"><div class="panel">
    <h2>إعداد سوق أسهم صقيل</h2>
    <p class="lead">حدّد عدد المجموعات وأسماءها، وسيرتّب النظام أدوارها عشوائيًا عند البدء.</p>
    <div class="count-row"><label for="cnt">عدد المجموعات</label>
      <div class="stepper"><button id="cMinus" ${n<=MIN_G?"disabled":""} aria-label="إنقاص">−</button>
      <input id="cnt" class="num" type="number" min="${MIN_G}" max="${MAX_G}" value="${n}">
      <button id="cPlus" ${n>=MAX_G?"disabled":""} aria-label="زيادة">+</button></div>
      <span style="color:var(--muted)">من ${MIN_G} إلى ${MAX_G}</span></div>
    <div class="names">${fields}</div>
    <div class="setup-actions">
      <button class="btn big amber" id="startBtn">بدء السوق</button>
      <button class="btn big ghost" id="howBtn">طريقة اللعب</button>
    </div>
  </div></section>`;
  const setCount = v => {
    UI.setupCount = clamp(Math.floor(+v)||MIN_G, MIN_G, MAX_G);
    const m = UI.setupCount;
    while(UI.setupNames.length < m) UI.setupNames.push("");
    let f = "";
    for(let i=0;i<m;i++) f += `<label class="name-field"><span class="num">${i+1}</span><input data-i="${i}" maxlength="30" placeholder="المجموعة ${i+1}" value="${esc(UI.setupNames[i])}"></label>`;
    app.querySelector(".names").innerHTML = f;
    app.querySelector("#cnt").value = m;
    app.querySelector("#cMinus").disabled = m<=MIN_G;
    app.querySelector("#cPlus").disabled = m>=MAX_G;
    app.querySelectorAll(".name-field input").forEach(inp => inp.oninput = e => UI.setupNames[+e.target.dataset.i] = e.target.value);
  };
  app.querySelector("#cMinus").onclick = () => setCount(UI.setupCount-1);
  app.querySelector("#cPlus").onclick = () => setCount(UI.setupCount+1);
  app.querySelector("#cnt").onchange = e => setCount(e.target.value);
  setCount(n);
  app.querySelector("#howBtn").onclick = showHow;
  app.querySelector("#startBtn").onclick = () => {
    const names = [];
    const n = UI.setupCount;
    for(let i=0;i<n;i++){ const v=(UI.setupNames[i]||"").trim(); names.push(v || `المجموعة ${i+1}`); }
    const dup = names.find((x,i)=>names.indexOf(x)!==i);
    if(dup){ toast(`الاسم «${dup}» مكرر، غيّره ثم ابدأ`, "err"); return; }
    newGame(names); UI.sel=null; render();
  };
}

/* ---------- اللعب ---------- */
function orderStrip(){
  return `<div class="order-strip">${S.teams.map((t,i)=>`<span class="${i<S.cur?"done":i===S.cur?"now":""}">${esc(t.name)}</span>`).join("")}</div>`;
}
function metaLine(){
  return `<div class="meta"><span>الدورة <span class="num">${S.round}</span></span><span class="sep">|</span><span>المجموعة <span class="num">${S.cur+1}</span> من <span class="num">${S.teams.length}</span></span></div>`;
}
let lastStageKey = "";
function renderGame(){
  let stage = "";
  if(S.phase==="question") stage = stageQuestion();
  else if(S.phase==="reward") stage = stageReward();
  else if(S.phase==="market") stage = stageMarket();
  else if(S.phase==="marketUpdate") stage = stageUpdate();
  const key = S.phase+"|"+S.round+"|"+S.cur;
  const enter = key!==lastStageKey && (S.phase==="question" || S.phase==="marketUpdate");
  lastStageKey = key;
  app.innerHTML = `<div class="game"><section class="stage ${S.phase==="market"?"mk":""} ${enter?"stage-enter":""}" id="stage">${stage}</section><aside class="board" id="board"></aside></div>`;
  renderBoard();
  bindStage();
}
function renderBoard(flashId){
  const b = document.getElementById("board"); if(!b) return;
  const cur = S.phase!=="marketUpdate" ? curTeam().id : null;
  b.innerHTML = `<h3>ترتيب المجموعات <small>بالسيولة</small></h3><ol>${ranking().map((r,k)=>
    `<li class="${r.t.id===cur?"cur":""} ${r.t.id===flashId?"flash":""}"><span class="rk num">${k+1}</span><span class="tn">${esc(r.t.name)}</span><span class="tw num">${fmt(r.w)}</span></li>`).join("")}</ol>`;
}

function stageReward(){
  const t = curTeam(), r = S.lastReward;
  const anim = UI.animReward; 
  const amtHtml = r.correct
    ? `<div class="amount pop" id="rAmt"><span class="num">+<span id="rNum">${anim?"0":fmt(r.amt)}</span></span></div>`

  return `${metaLine()}${orderStrip()}

    <div class="reward">
      <div class="label">${r.correct?"مكافأتكم لهذا السؤال":"إجابة خاطئة"}</div>

      <div class="newbal">الرصيد الآن: <b class="num" id="rBal">${fmt(anim ? wealth(t)-r.amt : wealth(t))}</b> ريال</div>
    </div>
    <div class="center-actions"><button class="btn big amber" id="toMk">الانتقال إلى السوق</button></div>`;
}
function stageMarket(){
  const t = curTeam(), sv = stockValue(t);
  const used = MAX_MOVES - S.movesLeft;
  const cos = S.companies.map(c => {
    const meta = COMPANIES.find(x=>x.id===c.id), own = t.holdings[c.id]||0;
    const chg = c.hist.length===1 && c.price===c.prev ? `<span class="chg flat">سعر الافتتاح</span>` : chgBadge(c.prev, c.price);
    const lock = tradedNow(c.id);
    return `<button class="co ${UI.sel===c.id?"sel":""} ${lock?"lock":""}" data-co="${c.id}" ${lock?"disabled":""}>
      <span class="nm"><span class="ic" aria-hidden="true">${meta.ic}</span>${meta.name}</span>
      <span class="pr"><span class="num">${fmt(c.price)}</span> <small>ريال</small></span>
      ${chg}
      ${sparkline(c)}
      ${lock?`<span class="lk">تم التداول عليه هذه الدورة</span>`:""}
      <span class="own">${own?`تملكون <b class="num">${own}</b> سهم • <b class="num">${fmt(own*c.price)}</b>`:"لا تملكون أسهمًا"}</span>
    </button>`;
  }).join("");
  let panel = "";
  if(S.movesLeft<=0) panel = `<div class="hint">استُخدمت الحركتان. اضغط «إنهاء دور المجموعة» للانتقال إلى المجموعة التالية.</div>`;
  else if(!UI.sel) panel = `<div class="hint">اختر شركة لتنفيذ عملية شراء أو بيع. كل عملية حركة واحدة، ولا يُسمح بحركتين على السهم نفسه في الدورة. الشراء يرفع سعر السهم والبيع يخفضه بحسب حجم العملية.</div>`;
  else panel = tradePanel();
  return `${metaLine()}
    <div class="mk-head"><div class="team-name">${esc(t.name)}</div><button class="btn amber" id="endTurn">إنهاء دور المجموعة</button></div>
    <div class="stats">
      <div class="stat"><div class="k">النقد المتوفر</div><div class="v num" id="sCash">${fmt(t.cash)}</div></div>
      <div class="stat"><div class="k">قيمة الأسهم</div><div class="v num">${fmt(sv)}</div></div>
      <div class="stat hl"><div class="k">إجمالي الثروة</div><div class="v num">${fmt(t.cash+sv)}</div></div>
      <div class="stat"><div class="k">الحركات المتبقية</div><div class="v"><span class="num">${S.movesLeft}</span> من <span class="num">${MAX_MOVES}</span></div>
        <div class="moves-dots">${Array.from({length:MAX_MOVES},(_,i)=>`<b class="${i<used?"used":""}"></b>`).join("")}</div></div>
    </div>
    <div class="market-area"><div class="cos">${cos}</div>${panel}</div>`;
}
function tradePanel(){
  const t = curTeam(), c = S.companies.find(x=>x.id===UI.sel), meta = COMPANIES.find(x=>x.id===c.id);
  const own = t.holdings[c.id]||0;
  return `<div class="trade" id="trade">
    <div><div class="tco">${meta.ic} ${meta.name}</div>
      <div class="tsub">سعر السهم <b class="num">${fmt(c.price)}</b> ريال • تملكون <b class="num">${own}</b> سهم</div></div>
    <div class="seg" role="tablist">
      <button class="buy ${UI.mode==="buy"?"on":""}" data-mode="buy">شراء</button>
      <button class="sell ${UI.mode==="sell"?"on":""}" data-mode="sell">بيع</button>
    </div>
    <div class="qty">
      <div class="stepper"><button id="qMinus" aria-label="إنقاص">−</button>
        <input id="qty" class="num" type="number" min="1" value="${UI.qty}" inputmode="numeric" aria-label="عدد الأسهم">
        <button id="qPlus" aria-label="زيادة">+</button></div>
      <button class="max" id="qMax">الحد الأقصى</button>
      <div class="total"><div class="k" id="tLbl"></div><div class="v"><span class="num" id="tVal"></span> <small style="font-size:.55em">ريال</small></div><div class="err" id="tErr"></div></div>
    </div>
    <button class="btn exec ${UI.mode}" id="exec">${UI.mode==="buy"?"تنفيذ الشراء":"تنفيذ البيع"}</button>
  </div>`;
}
function maxQty(){
  const t = curTeam(), p = priceOf(UI.sel);
  if(UI.mode!=="buy") return t.holdings[UI.sel]||0;
  let q = Math.floor(t.cash/p);
  while(q>0 && impactPrice(UI.sel,q,"buy")*q > t.cash) q--;
  return q;
}
function updatePreview(){
  const t = curTeam(), p = priceOf(UI.sel), q = UI.qty;
  const np = q>=1 ? impactPrice(UI.sel, q, UI.mode) : p, total = np*Math.max(q,0);
  document.getElementById("tLbl").textContent = (UI.mode==="buy" ? "تكلفة الشراء" : "قيمة البيع") + ` • سعر التنفيذ ${fmt(np)}`;
  document.getElementById("tVal").textContent = fmt(total);
  let err = "";
  if(!(q>=1)) err = "حدد عدد أسهم صحيحًا";
  else if(UI.mode==="buy" && total>t.cash) err = "الرصيد غير كافٍ لإتمام العملية";
  else if(UI.mode==="sell" && q>(t.holdings[UI.sel]||0)) err = (t.holdings[UI.sel]||0) ? "الكمية أكبر مما تملكه المجموعة" : "لا تملك المجموعة أسهمًا في هذه الشركة";
  document.getElementById("tErr").textContent = err;
  document.getElementById("exec").disabled = !!err;
}
function stageUpdate(){
  if(UI.updPending){
    return `<div class="upd-title">تحديث السوق</div><div class="upd-sub">انتهت الدورة <span class="num">${S.round}</span>… يجري احتساب الأسعار الجديدة</div><div class="scan"><i></i></div>`;
  }
  const items = S.lastChanges.map((ch,i) => {
    const meta = COMPANIES.find(x=>x.id===ch.id);
    return `<div class="upd" style="animation-delay:${i*60}ms"><div class="nm">${meta.ic} ${meta.name}</div>
      <div class="pr"><span class="num">${fmt(ch.to)}</span> <small style="font-size:.55em;color:var(--muted)">ريال</small></div>
      <div class="path">كان <span class="num">${fmt(ch.from)}</span></div>${chgBadge(ch.from,ch.to)}</div>`;
  }).join("");
  return `<div class="upd-title">تحديث السوق</div><div class="upd-sub">أسعار الشركات بعد نهاية الدورة <span class="num">${S.round}</span></div>
    <div class="upd-grid">${items}</div>
    <div class="center-actions"><button class="btn big amber" id="nextRound">بدء الدورة <span class="num">${S.round+1}</span></button></div>`;
}

function bindStage(){
  const $ = s => app.querySelector(s);
  if(S.phase==="question"){
    $("#aOk").onclick = () => { answer(true); UI.animReward = true; render(); playReward(); };
    $("#aNo").onclick = () => { answer(false); UI.animReward = false; render(); };
  }
  if(S.phase==="reward"){
    $("#toMk").onclick = () => { toMarket(); UI.sel=null; UI.qty=1; UI.mode="buy"; render(); };
  }
  if(S.phase==="market"){
    app.querySelectorAll("[data-co]").forEach(b => b.onclick = () => {
      if(S.movesLeft<=0 || tradedNow(b.dataset.co)) return;
      UI.sel = b.dataset.co; UI.qty = 1;
      const own = curTeam().holdings[UI.sel]||0; if(!own) UI.mode="buy";
      render();
    });
    $("#endTurn").onclick = () => {
      const name = curTeam().name, last = S.cur===S.teams.length-1;
      endTurn(); UI.sel=null;
      if(last){ UI.updPending = true; render(); setTimeout(()=>{ UI.updPending=false; render(); }, 1600); }
      else { toast(`انتهى دور ${name}`); render(); }
    };
    if(UI.sel && S.movesLeft>0){
      app.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { UI.mode=b.dataset.mode; UI.qty=1; render(); });
      const q = $("#qty");
      const setQ = v => { UI.qty = Math.max(1, Math.floor(+v)||1); q.value = UI.qty; updatePreview(); };
      $("#qMinus").onclick = () => setQ(UI.qty-1);
      $("#qPlus").onclick = () => setQ(UI.qty+1);
      $("#qMax").onclick = () => { const m = maxQty(); if(m<1){ toast(UI.mode==="buy"?"الرصيد غير كافٍ لشراء سهم واحد":"لا تملك المجموعة أسهمًا في هذه الشركة","err"); return;} setQ(m); };
      q.oninput = () => { UI.qty = Math.floor(+q.value)||0; updatePreview(); };
      q.onkeydown = e => { if(e.key==="Enter" && !$("#exec").disabled) $("#exec").click(); };
      $("#exec").onclick = () => {
        const meta = COMPANIES.find(x=>x.id===UI.sel), qty = UI.qty, tid = curTeam().id;
        const r = UI.mode==="buy" ? buy(UI.sel, qty) : sell(UI.sel, qty);
        if(!r.ok){ toast(r.msg, "err"); return; }
        toast(UI.mode==="buy" ? `تم شراء ${qty} سهم من ${meta.name} بـ ${fmt(r.cost)} ريال • السهم ${fmt(r.from)} ← ${fmt(r.to)}` : `تم بيع ${qty} سهم من ${meta.name} بـ ${fmt(r.rev)} ريال • السهم ${fmt(r.from)} ← ${fmt(r.to)}`, "ok");
        UI.qty = 1; UI.sel = null;
        render(); renderBoard(tid);
      };
      updatePreview();
    }
  }
  if(S.phase==="marketUpdate" && !UI.updPending){
    $("#nextRound").onclick = () => { startNextRound(); render(); };
  }
}
function playReward(){
  const r = S.lastReward, t = curTeam(), n = document.getElementById("rNum"), bal = document.getElementById("rBal");
  if(!n){ UI.animReward=false; return; }
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const finish = () => { n.textContent = fmt(r.amt); countUp(bal, wealth(t)-r.amt, wealth(t)); renderBoard(t.id); UI.animReward=false; };
  if(reduce) return finish();
  let k = 0; const spins = 14;
  const tick = () => { k++; n.textContent = fmt(randomReward());
    if(k<spins) setTimeout(tick, 45 + k*9); else finish(); };
  tick();
}

/* ---------- النهاية ---------- */
function renderFinal(){
  const f = S.final, top = f[0], ties = f.filter(r=>r.total===top.total);
  app.innerHTML = `<section class="final">
    <div class="stage winner stage-enter">
      <div class="cup" aria-hidden="true">🏆</div>
      <div class="lbl">${ties.length>1?"تعادل في المركز الأول":"المجموعة الفائزة"}</div>
      <div class="wn">${ties.map(r=>esc(r.name)).join(" و ")}</div>
      <div class="bal-label">الرصيد النهائي</div>
      <div class="wb"><span class="num" id="wBal">0</span> ريال</div>
    </div>
    <div class="ranking"><h3>الترتيب النهائي</h3>
      ${f.map((r,i)=>{ const pos = f.findIndex(x=>x.total===r.total)+1;
        return `<div class="rk-row"><span class="p num">${pos}</span><span class="n">${esc(r.name)}<small>نقد <span class="num">${fmt(r.cashBefore)}</span> + تصفية أسهم <span class="num">${fmt(r.stocks)}</span></small></span><span class="b"><span class="num">${fmt(r.total)}</span> ريال</span></div>`;}).join("")}
    </div>
    <div class="center-actions"><button class="btn big amber" id="again">لعبة جديدة</button></div>
  </section>`;
  countUp(document.getElementById("wBal"), 0, top.total, 1400);
  app.querySelector("#again").onclick = () => { clearSave(); S=null; UI.setupNames = []; render(); };
}

/* ---------- الاستئناف ---------- */
function renderResume(saved){
  const phaseName = {order:"ترتيب المجموعات", question:"مرحلة السؤال", reward:"مرحلة المكافأة", market:"مرحلة السوق", marketUpdate:"تحديث السوق"}[saved.phase]||"";
  app.innerHTML = `<section class="setup"><div class="panel">
    <h2>يوجد سوق محفوظ</h2>
    <p class="lead"><span class="num">${saved.teams.length}</span> مجموعات • الدورة <span class="num">${saved.round}</span> • ${phaseName}${saved.phase!=="marketUpdate"&&saved.phase!=="order"?` • دور ${esc(saved.teams[saved.cur].name)}`:""}</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <button class="btn big amber" id="resume">استكمال اللعبة</button>
      <button class="btn big ghost" id="fresh">بدء لعبة جديدة</button>
    </div></div></section>`;
  app.querySelector("#resume").onclick = () => { S = saved; render(); };
  app.querySelector("#fresh").onclick = () => modal({
    title:"بدء لعبة جديدة؟", text:"سيُحذف السوق المحفوظ نهائيًا، ولا يمكن استرجاعه.",
    okText:"نعم، ابدأ من جديد", onOk:()=>{ clearSave(); S=null; render(); }
  });
}

/* ---------- أزرار عامة ---------- */
endBtn.onclick = () => modal({
  title:"هل تريد إنهاء اللعبة؟",
  text:"سيتم بيع جميع الأسهم لدى جميع المجموعات بالأسعار الحالية واحتساب الرصيد النهائي.",
  okText:"نعم، إنهاء اللعبة", onOk:()=>{ UI.updPending=false; finishGame(); render(); }
});
document.getElementById("fsBtn").onclick = () => {
  const d = document;
  if(!d.fullscreenElement){ (d.documentElement.requestFullscreen||d.documentElement.webkitRequestFullscreen||(()=>{})).call(d.documentElement); }
  else { (d.exitFullscreen||d.webkitExitFullscreen).call(d); }
};

/* ---------- تشغيل ---------- */
(function init(){
  const saved = load();
  if(saved && saved.v===1 && saved.phase==="finished"){ S = saved; render(); return; }
  if(saved && saved.v===1 && saved.teams && saved.phase!=="setup"){ renderResume(saved); return; }
  render();
})();
window.__saqeel = { get S(){return S}, answer, toMarket, buy, sell, endTurn, updateMarket, startNextRound, finishGame, stockValue, wealth };
</script>
</body>
</html>
