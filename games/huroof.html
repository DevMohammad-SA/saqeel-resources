:root{
  --bg:#1A1146; --bg-deep:#0F0A2B; --line:rgba(255,255,255,.12);
  --ink:#FFFFFF; --ink-soft:#BDB5E6; --ink-dim:#8F86C2;
  --tile:#F6F3FF; --tile-shade:#9D8FDA; --tile-ink:#1C1348;
  --yellow:#FFF57F; --orange:#FFB76C; --turq:#24CCC2; --coral:#FF686B;
  --t1:#24CCC2; --t1-shade:#188A84; --t1-ink:#1C1348;
  --t2:#FF686B; --t2-shade:#AD4749; --t2-ink:#1C1348;
  --dialog:#221861;
  --hex:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
}
*{box-sizing:border-box}
html{font-size:clamp(13px,.62vw + .55vh,22px)}
html,body{height:100%;margin:0}
body{background:var(--bg-deep);color:var(--ink);font-family:'Tajawal','Cairo','Segoe UI',Tahoma,sans-serif;font-weight:500;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font-family:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

#app{position:relative;height:100vh;height:100dvh;overflow:hidden;
  background:radial-gradient(120% 95% at 62% 38%,#2C1D72 0%,#1A1146 48%,#0F0A2B 100%)}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 1px,transparent 1px 34px),repeating-linear-gradient(-45deg,rgba(255,255,255,.03) 0 1px,transparent 1px 34px);
  -webkit-mask-image:radial-gradient(circle at 50% 50%,#000 25%,transparent 80%);mask-image:radial-gradient(circle at 50% 50%,#000 25%,transparent 80%)}
.screen{position:absolute;inset:0;display:none;z-index:1}
.screen.active{display:flex}

/* ========== buttons ========== */
.btn{--b:#33276F;--bs:#1C1450;--bi:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;gap:.5em;border:0;cursor:pointer;
  padding:.72em 1.1em;border-radius:14px;background:var(--b);color:var(--bi);font-size:1rem;font-weight:700;line-height:1.25;
  box-shadow:0 .28em 0 var(--bs);transition:transform .08s,box-shadow .08s,filter .15s;-webkit-tap-highlight-color:transparent;text-align:center}
.btn:hover{filter:brightness(1.13)}
.btn:active{transform:translateY(.2em);box-shadow:0 .08em 0 var(--bs)}
.btn:disabled{opacity:.38;cursor:not-allowed;filter:none;transform:none;box-shadow:0 .28em 0 var(--bs)}
.btn svg{width:1.2em;height:1.2em;flex:none}
.btn-yellow{--b:var(--yellow);--bs:#BDB23A;--bi:var(--tile-ink)}
.btn-coral{--b:var(--coral);--bs:#A8393C;--bi:#fff}
.btn-ghost{--b:transparent;--bs:transparent;color:var(--ink-soft)}
.btn-xl{font-size:1.75rem;font-weight:900;padding:.55em 2.3em;border-radius:20px}
.btn-lg{font-size:1.2rem;padding:.7em 1.6em}
.flip-rtl{display:inline-flex;transform:scaleX(-1)}

/* ========== start screen ========== */
.start{align-items:center;justify-content:center;overflow:auto;padding:4vmin}
.start-inner{display:flex;flex-direction:column;align-items:center;gap:clamp(1rem,3.2vh,2.6rem);text-align:center;margin:auto}
.start-logo{height:clamp(84px,17vh,190px);width:auto;animation:rise .6s ease-out both}
.tiles{display:flex;gap:.5rem}
.tile{--c:var(--turq);width:clamp(54px,9.5vmin,124px);aspect-ratio:.866;clip-path:var(--hex);background:var(--c);color:var(--tile-ink);
  display:grid;place-items:center;font-size:clamp(28px,5.2vmin,66px);font-weight:900;line-height:1;
  animation:tileIn .62s cubic-bezier(.2,.9,.3,1.45) both;animation-delay:calc(.2s + var(--k) * .09s)}
.tile-1{--c:var(--coral)}.tile-2{--c:var(--orange)}.tile-3{--c:var(--yellow)}
.start-title{margin:0;font-size:clamp(3rem,6vmin + 3.2vw,9rem);font-weight:900;line-height:1.05;animation:rise .6s .5s ease-out both}
.start-actions{display:flex;flex-direction:column;align-items:center;gap:.9rem;animation:rise .5s .7s ease-out both}

.setup{width:min(1000px,100%);display:flex;flex-direction:column;gap:1.6rem;margin:auto}
.setup-head{display:flex;align-items:center;justify-content:center;gap:1rem}
.setup-head img{height:3.8rem;width:auto}
.setup-head h2{margin:0;font-size:2.5rem;font-weight:900}
.setup-actions{display:flex;flex-direction:column;align-items:center;gap:.5rem}

/* ========== team editor (setup + settings) ========== */
.editors{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem}
.editor{--c:var(--t1);display:flex;flex-direction:column;gap:.9rem;padding:1.15rem;border-radius:20px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);border-top:6px solid var(--c)}
.editor[data-team="1"]{--c:var(--t2)}
.editor-head{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.editor-head strong{font-size:1.25rem;font-weight:900}
.editor-head .dir{margin-inline-start:auto;display:flex;align-items:center;gap:.35rem;color:var(--ink-soft);font-size:.92rem}
.editor-head .dir svg{width:1.15em;height:1.15em;color:var(--c)}
.mini-hex{width:1.35rem;aspect-ratio:.866;clip-path:var(--hex);background:var(--c);flex:none}
.field{display:flex;flex-direction:column;gap:.4rem;color:var(--ink-soft);font-size:.92rem;font-weight:700}
.name-input{width:100%;padding:.7em .9em;border-radius:14px;border:2px solid var(--line);background:rgba(0,0,0,.25);color:#fff;font-size:1.3rem;font-weight:700;outline:none}
.name-input:focus{border-color:var(--c)}
.swatches{display:flex;flex-wrap:wrap;gap:.5rem .55rem}
.swatch{position:relative;width:2.1rem;height:2.1rem;border-radius:50%;border:0;padding:0;cursor:pointer;flex:none;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);transition:transform .12s}
.swatch:hover:not(:disabled){transform:scale(1.1)}
.swatch[aria-checked="true"],.swatch.custom.checked{box-shadow:0 0 0 3px var(--dialog),0 0 0 6px #fff}
.swatch:disabled{opacity:.2;cursor:not-allowed}
.swatch.custom{overflow:hidden;background:conic-gradient(#FF686B,#FFB76C,#FFF57F,#5BD66B,#24CCC2,#3FA7FF,#9B7BFF,#FF6FB5,#FF686B)}
.swatch.custom input{position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);opacity:0;cursor:pointer;border:0;padding:0}
.swatch.custom:focus-within{outline:3px solid var(--yellow);outline-offset:3px}

/* ========== game layout ========== */
.game{gap:clamp(10px,1.6vmin,28px);padding:clamp(10px,1.8vmin,32px)}
.panel{position:relative;width:clamp(250px,20vw,380px);flex:none;display:flex;flex-direction:column;gap:1rem;padding:1.2rem;overflow:auto;
  border-radius:28px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.025))}
.stage{flex:1;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
.is-fs .game{padding:1vmin;gap:1vmin}
.is-fs .panel{width:clamp(230px,18vw,340px)}

.brand{display:flex;flex-direction:column;align-items:center;gap:.55rem;padding-bottom:1rem;border-bottom:1px solid var(--line);text-align:center}
.brand img{height:clamp(56px,9.5vh,112px);width:auto}
.brand .title{font-size:1.95rem;font-weight:900;line-height:1.15}
.icon-btn{position:absolute;top:.8rem;inset-inline-end:.8rem;width:2.5rem;height:2.5rem;border-radius:50%;border:1px solid var(--line);
  background:rgba(255,255,255,.06);color:var(--ink-soft);display:grid;place-items:center;cursor:pointer;padding:0}
.icon-btn svg{width:1.2rem;height:1.2rem}
.icon-btn:hover{color:#fff}
.icon-btn[aria-pressed="true"]{color:var(--coral);border-color:rgba(255,104,107,.5)}

.round{display:flex;align-items:center;justify-content:center;gap:.6rem;color:var(--ink-soft);font-size:1.15rem;font-weight:700}
.round b{width:2.7rem;aspect-ratio:.866;clip-path:var(--hex);background:var(--yellow);color:var(--tile-ink);display:grid;place-items:center;font-size:1.35rem;font-weight:900}

.teams{display:flex;flex-direction:column;gap:.75rem}
.team{--c:var(--t1);--ci:var(--t1-ink);display:flex;align-items:center;gap:.9rem;padding:.7rem .8rem;border-radius:20px;
  background:rgba(255,255,255,.05);border:2px solid transparent;transition:border-color .3s,background .3s}
.team[data-team="1"]{--c:var(--t2);--ci:var(--t2-ink)}
.team-hex{width:4.5rem;aspect-ratio:.866;flex:none;clip-path:var(--hex);background:var(--c);color:var(--ci);display:grid;place-items:center;font-size:2.1rem;font-weight:900;line-height:1}
.team-hex.bump{animation:bump .35s cubic-bezier(.2,.9,.3,1.5)}
.team-info{min-width:0}
.team-name{font-size:1.45rem;font-weight:900;line-height:1.25;overflow-wrap:anywhere}
.team-dir{display:flex;align-items:center;gap:.35rem;margin-top:.2rem;color:var(--ink-soft);font-size:.9rem}
.team-dir svg{width:1.15em;height:1.15em;color:var(--c);flex:none}
.team.winner{border-color:var(--yellow);background:rgba(255,245,127,.1)}

.controls{margin-top:auto;display:flex;flex-direction:column;gap:.7rem}
.btn-wide{width:100%;font-size:1.4rem;font-weight:900;padding:.62em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.grid2 .btn{flex-direction:column;gap:.3rem;font-size:.95rem;padding:.7em .4em;min-height:4.3rem}
.hint{margin:0;color:var(--ink-dim);font-size:.8rem;line-height:1.5;text-align:center}

/* ========== board ========== */
.board{width:100%;height:100%;display:block;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow:visible}
.cell{cursor:pointer;outline:none;transition:opacity .4s}
.cell .lift,.cell .pop,.cell .ring{transform-box:fill-box;transform-origin:center}
.cell .lift{transition:transform .14s ease}
.cell .face{fill:var(--tile);stroke:#fff;stroke-width:2.5;transition:fill .22s ease}
.cell .shade{fill:var(--tile-shade);transition:fill .22s ease}
.cell .letter{fill:var(--tile-ink);font-family:'Tajawal','Cairo',sans-serif;font-weight:900;font-size:52px;pointer-events:none;transition:fill .22s ease}
.cell .ring{fill:none;stroke:#fff;stroke-width:6;opacity:0;pointer-events:none}
.cell.own-0 .face{fill:var(--t1);stroke:rgba(255,255,255,.5)}
.cell.own-0 .shade{fill:var(--t1-shade)}
.cell.own-0 .letter{fill:var(--t1-ink)}
.cell.own-0 .ring{stroke:var(--t1)}
.cell.own-1 .face{fill:var(--t2);stroke:rgba(255,255,255,.5)}
.cell.own-1 .shade{fill:var(--t2-shade)}
.cell.own-1 .letter{fill:var(--t2-ink)}
.cell.own-1 .ring{stroke:var(--t2)}
.cell:not(.neutral){cursor:default}
@media (hover:hover){
  .board:not(.won) .cell.neutral:hover .lift{transform:translateY(-7px)}
  .board:not(.won) .cell.neutral:hover .face{fill:#fff}
}
.cell:focus-visible .face{stroke:var(--yellow);stroke-width:7}
.cell.claim .pop{animation:claim .42s cubic-bezier(.2,.9,.3,1.4)}
.cell.claim .ring{animation:ring .6s ease-out}
.cell.shake .pop{animation:shake .32s ease}
.board.intro .cell .lift{animation:cellIn .45s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(var(--d) * 40ms)}
.board.won .cell:not(.on-path){opacity:.36}
.cell.on-path .lift{filter:url(#glow)}
.cell.on-path .face{stroke:var(--yellow);stroke-width:6}
.cell.on-path .pop{animation:pulse 1.2s ease-in-out infinite;animation-delay:calc(var(--i) * 90ms)}
.frame{--c:var(--t1);--cs:var(--t1-shade)}
.frame.f1{--c:var(--t2);--cs:var(--t2-shade)}
.frame .f-face{fill:var(--c);transition:fill .25s}
.frame .f-shade{fill:var(--cs);transition:fill .25s}

/* ========== modals ========== */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:4vmin;background:rgba(10,6,30,.62);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fade .12s ease-out}
.dialog{position:relative;width:min(640px,100%);max-height:92vh;overflow:auto;padding:clamp(22px,3.2vmin,42px);border-radius:28px;
  background:var(--dialog);border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.45);animation:popIn .17s cubic-bezier(.2,.9,.3,1.25);outline:none}
.dialog h2{margin:0;font-size:2.1rem;font-weight:900;line-height:1.3;text-align:center}
.dialog-close{position:absolute;top:.9rem;inset-inline-end:.9rem;width:2.6rem;height:2.6rem;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:var(--ink-soft);display:grid;place-items:center;cursor:pointer;padding:0}
.dialog-close:hover{color:#fff;background:rgba(255,255,255,.15)}
.dialog-close svg{width:1.3rem;height:1.3rem}
.muted{margin:0;color:var(--ink-soft);font-size:1.12rem;text-align:center;line-height:1.6}
.stack{display:flex;flex-direction:column;align-items:center;gap:1rem}

.sel-letter{width:6.4rem;aspect-ratio:.866;clip-path:var(--hex);background:var(--tile);color:var(--tile-ink);display:grid;place-items:center;font-size:3.5rem;font-weight:900;line-height:1}
.sel-letter.own-0{background:var(--t1);color:var(--t1-ink)}
.sel-letter.own-1{background:var(--t2);color:var(--t2-ink)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:1rem;width:100%;margin-top:.3rem}
.pick-btn,.btn-team{--c:var(--t1);--cs:var(--t1-shade);--ci:var(--t1-ink)}
.pick-1,.btn-team.to-1{--c:var(--t2);--cs:var(--t2-shade);--ci:var(--t2-ink)}
.pick-btn{border:0;cursor:pointer;min-height:8.8rem;padding:1rem;border-radius:24px;background:var(--c);color:var(--ci);box-shadow:0 .45rem 0 var(--cs);
  font-size:2.25rem;font-weight:900;line-height:1.2;overflow-wrap:anywhere;transition:transform .08s,box-shadow .08s,filter .15s;-webkit-tap-highlight-color:transparent}
.pick-btn:hover{filter:brightness(1.07)}
.pick-btn:active{transform:translateY(.35rem);box-shadow:0 .1rem 0 var(--cs)}
.owned-actions{display:flex;flex-direction:column;gap:.85rem;width:100%;margin-top:.3rem}
.btn-team{--b:var(--c);--bs:var(--cs);--bi:var(--ci);flex-direction:column;gap:.15rem;font-size:1.45rem;font-weight:900;padding:.8em}
.btn-team small{font-size:.8rem;font-weight:700;opacity:.8}
.owned-actions .btn:not(.btn-team){font-size:1.15rem;padding:.9em}
.confirm-actions{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;width:100%;margin-top:.4rem}
.confirm-actions .btn{min-width:9rem;font-size:1.15rem}

.dialog-winner{width:min(780px,100%);background:radial-gradient(circle at 50% 0%,#3B2A92 0%,var(--dialog) 62%)}
.win-badge{--c:var(--t1);--ci:var(--t1-ink);width:8rem;aspect-ratio:.866;clip-path:var(--hex);background:var(--c);color:var(--ci);display:grid;place-items:center;animation:badge .7s cubic-bezier(.2,.9,.3,1.45) both}
.win-badge.win-1{--c:var(--t2);--ci:var(--t2-ink)}
.win-badge svg{width:46%;height:auto}
.dialog .win-title{font-size:clamp(2.4rem,4.6vw,4.4rem);line-height:1.2;animation:rise .45s .2s ease-out both}
.win-actions{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center;margin-top:.4rem}

.dialog-settings{width:min(920px,100%)}
.settings{display:flex;flex-direction:column;gap:1.25rem}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.switch{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.9rem 1.1rem;border-radius:16px;border:1px solid var(--line);
  background:rgba(255,255,255,.05);color:var(--ink);cursor:pointer;font-size:1.08rem;font-weight:700;text-align:start}
.switch-track{position:relative;width:3.2rem;height:1.8rem;border-radius:99px;background:rgba(255,255,255,.18);flex:none;transition:background .2s}
.switch-thumb{position:absolute;top:.2rem;right:.2rem;width:1.4rem;height:1.4rem;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-checked="true"] .switch-track{background:var(--turq)}
.switch[aria-checked="true"] .switch-thumb{transform:translateX(-1.4rem)}
.settings-actions{display:flex;justify-content:space-between;gap:.8rem;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:clamp(14px,4vmin,40px);z-index:80;max-width:90vw;padding:.7rem 1.35rem;border-radius:99px;background:#fff;color:var(--tile-ink);
  font-weight:700;font-size:1.05rem;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;pointer-events:none;transform:translate(-50%,16px);transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

/* ========== motion ========== */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes tileIn{from{opacity:0;transform:translateY(45%) scale(.5) rotate(-14deg)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes popIn{from{opacity:0;transform:scale(.92)}}
@keyframes claim{0%{transform:scale(.55)}60%{transform:scale(1.13)}100%{transform:scale(1)}}
@keyframes ring{0%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(1.5)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes cellIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes bump{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes badge{from{opacity:0;transform:scale(.3) rotate(-30deg)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.001ms!important}
}

/* ========== responsive ========== */
@media (max-width:760px){
  .editors,.toggles{grid-template-columns:1fr}
  .pick-btn{min-height:6.5rem;font-size:1.7rem}
}
@media (max-aspect-ratio:5/6){
  .game{flex-direction:column}
  .stage{order:-1}
  .panel{width:auto;overflow:visible;gap:.7rem;padding:.9rem}
  .brand{flex-direction:row;justify-content:center;padding-bottom:.6rem}
  .brand img{height:2.8rem}
  .brand .title{font-size:1.5rem}
  .icon-btn{top:.7rem}
  .teams{flex-direction:row}
  .team{flex:1;min-width:0;gap:.6rem;padding:.5rem}
  .team-hex{width:3.2rem;font-size:1.5rem}
  .team-name{font-size:1.1rem}
  .team-dir{font-size:.78rem}
  .grid2{grid-template-columns:repeat(4,1fr)}
  .grid2 .btn{font-size:.8rem;min-height:3.8rem}
  .hint{display:none}
}
</style>
</head>
<body>
<div id="app">
  <section id="screen-start" class="screen start active" aria-label="البداية"></section>

  <section id="screen-game" class="screen game" aria-label="لوحة المسابقة">
    <aside class="panel" aria-label="لوحة التحكم">
      <button class="icon-btn" id="btnMute" type="button" aria-pressed="false" aria-label="كتم الأصوات"></button>
      <div class="brand">
        <img id="panelLogo" alt="جمعية صقيل لتنمية الشباب">
        <div class="title">حروف مع صقيل</div>
      </div>
      <div class="round">الجولة <b id="roundNo">١</b></div>
      <div class="teams">
        <div class="team" data-team="0">
          <div class="team-hex"><span class="team-count">٠</span></div>
          <div class="team-info"><div class="team-name"></div><div class="team-dir" data-icon="dirH" data-label="يربط اليمين باليسار"></div></div>
        </div>
        <div class="team" data-team="1">
          <div class="team-hex"><span class="team-count">٠</span></div>
          <div class="team-info"><div class="team-name"></div><div class="team-dir" data-icon="dirV" data-label="يربط الأعلى بالأسفل"></div></div>
        </div>
      </div>
      <div class="controls">
        <button id="btnUndo" class="btn btn-yellow btn-wide" type="button"><span class="flip-rtl" data-icon="undo"></span>تراجع</button>
        <div class="grid2">
          <button id="btnNew" class="btn" type="button"><span data-icon="hexPlus"></span>جولة جديدة</button>
          <button id="btnReset" class="btn" type="button"><span data-icon="reset"></span>إعادة ضبط الجولة</button>
          <button id="btnSettings" class="btn" type="button"><span data-icon="sliders"></span>الإعدادات</button>
          <button id="btnFs" class="btn" type="button"><span id="fsIcon"></span><span id="fsLabel">ملء الشاشة</span></button>
        </div>
        <p class="hint">لتعديل خلية ملوّنة: زر الفأرة الأيمن أو ضغط مطوّل عليها</p>
      </div>
    </aside>
    <main class="stage" id="stage"></main>
  </section>
</div>
<div id="modals"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

const $ = (s, r = document) => r.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
function el(tag, props = {}, children = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v === false || v == null) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of [].concat(children)) if (c != null && c !== false) e.append(c);
  return e;
}
function sv(tag, attrs = {}) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}
const toAr = (n) => String(n).replace(/[0-9]/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const sameColor = (a, b) => String(a).toLowerCase() === String(b).toLowerCase();
function hexToRgb(h) { h = h.replace('#', ''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
const rgbToHex = (rgb) => '#' + rgb.map((v) => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
const darken = (hex, f) => rgbToHex(hexToRgb(hex).map((v) => v * f));
function luminance(hex) {
  const [r, g, b] = hexToRgb(hex).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
function inkFor(hex) {
  const L = luminance(hex), Ld = luminance(INK_DARK);
  return (L + 0.05) / (Ld + 0.05) >= 1.05 / (L + 0.05) ? INK_DARK : '#FFFFFF';
}

/* =========================================================
   الشبكة السداسية — إحداثيات محورية (Axial)
   الصفوف الفردية مُزاحة نصف خلية (odd-r) وخلايا مدبّبة الرأس
   ========================================================= */
const S = 50;                      // نصف قطر الخلية
const HW = Math.sqrt(3) * S;       // عرض الخلية
const centerOf = (r, c) => ({ x: HW * (c + 0.5 * (r & 1)), y: 1.5 * S * r });
function hexPoints(k) {
  const p = [];
  for (let i = 0; i < 6; i++) { const a = (Math.PI / 180) * (60 * i - 90); p.push((S * k * Math.cos(a)).toFixed(2) + ',' + (S * k * Math.sin(a)).toFixed(2)); }
  return p.join(' ');
}
const AXIAL_DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
const toAxial = (r, c) => ({ q: c - (r - (r & 1)) / 2, r });
const fromAxial = (q, r) => ({ r, c: q + (r - (r & 1)) / 2 });
const NEIGHBORS = Array.from({ length: N }, (_, i) => {
  const r = Math.floor(i / COLS), c = i % COLS, a = toAxial(r, c);
  return AXIAL_DIRS.map(([dq, dr]) => fromAxial(a.q + dq, a.r + dr))
    .filter((p) => p.r >= 0 && p.r < ROWS && p.c >= 0 && p.c < COLS)
    .map((p) => p.r * COLS + p.c);
});

// الفريق الأول: من العمود الأيمن إلى الأيسر — الفريق الثاني: من الصف العلوي إلى السفلي
function findWinPath(owners, team) {
  const isStart = team === 0 ? (i) => i % COLS === COLS - 1 : (i) => i < COLS;
  const isGoal = team === 0 ? (i) => i % COLS === 0 : (i) => i >= N - COLS;
  const parent = new Array(N).fill(-2), queue = [];
  for (let i = 0; i < N; i++) if (owners[i] === team && isStart(i)) { parent[i] = -1; queue.push(i); }
  for (let h = 0; h < queue.length; h++) {
    const i = queue[h];
    if (isGoal(i)) { const path = []; for (let k = i; k !== -1; k = parent[k]) path.push(k); return path.reverse(); }
    for (const j of NEIGHBORS[i]) if (parent[j] === -2 && owners[j] === team) { parent[j] = i; queue.push(j); }
  }
  return null;
}

/* =========================================================
   الحفظ: LocalStorage، وعند تعذّره (معاينة Claude) تخزين المنصّة، ثم الذاكرة
   ========================================================= */
const Store = (() => {
  let mode = 'memory'; const mem = {};
  try { localStorage.setItem('__hs_t', '1'); localStorage.removeItem('__hs_t'); mode = 'local'; } catch (_) {
    if (window.storage && typeof window.storage.set === 'function') mode = 'platform';
  }
  return {
    get mode() { return mode; },
    async load() {
      try {
        if (mode === 'local') { const v = localStorage.getItem(STORE_KEY); return v ? JSON.parse(v) : null; }
        if (mode === 'platform') { try { const r = await window.storage.get(STORE_KEY, false); return r && r.value ? JSON.parse(r.value) : null; } catch (_) { return null; } }
        return mem[STORE_KEY] ? JSON.parse(mem[STORE_KEY]) : null;
      } catch (_) { return null; }
    },
    save(data) {
      const s = JSON.stringify(data);
      try {
        if (mode === 'local') localStorage.setItem(STORE_KEY, s);
        else if (mode === 'platform') window.storage.set(STORE_KEY, s, false).catch(() => {});
        else mem[STORE_KEY] = s;
      } catch (e) { console.warn('تعذّر الحفظ', e); }
    }
  };
})();

/* =========================================================
   الأصوات (Web Audio — بلا ملفات)
   ========================================================= */
const Sound = (() => {
  let ctx = null;
  function ac() {
    if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, at, dur, type, gain, freqEnd) {
    const c = ac(); if (!c) return;
    const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.03);
  }
  const on = () => App.settings.sound;
  return {
    claim() { if (!on()) return; tone(620, 0, 0.1, 'triangle', 0.22, 900); tone(1240, 0.07, 0.16, 'sine', 0.12); },
    undo() { if (!on()) return; tone(540, 0, 0.18, 'triangle', 0.2, 300); },
    win() {
      if (!on()) return;
      [523.25, 659.25, 783.99, 1046.5].forEach((f, k) => tone(f, k * 0.11, 0.34, 'triangle', 0.2));
      tone(1318.5, 0.46, 0.7, 'sine', 0.14);
      [1568, 2093].forEach((f, k) => tone(f, 0.56 + k * 0.07, 0.45, 'sine', 0.06));
    }
  };
})();

/* =========================================================
   الاحتفال (Confetti)
   ========================================================= */
const Confetti = (() => {
  let cv = null, ctx = null, parts = [], raf = 0, start = 0;
  function size() {
    cv = cv || $('#confetti'); ctx = ctx || cv.getContext('2d');
    const d = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(innerWidth * d); cv.height = Math.round(innerHeight * d); ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  function fire(teamColor) {
    size();
    const W = innerWidth, H = innerHeight, sc = Math.max(0.7, H / 900);
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const n = reduce ? 40 : 170, colors = [teamColor, teamColor, '#FFF57F', '#FFFFFF', '#FFB76C'];
    for (let k = 0; k < n; k++) {
      const left = k % 2 === 0;
      parts.push({ x: left ? -10 : W + 10, y: H * (0.7 + Math.random() * 0.22), vx: (left ? 1 : -1) * (5 + Math.random() * 13) * sc,
        vy: -(14 + Math.random() * 16) * sc, g: 0.34 * sc, rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3,
        w: (8 + Math.random() * 9) * sc, h: (5 + Math.random() * 6) * sc, c: colors[k % colors.length], hex: Math.random() < 0.3, tilt: Math.random() * 6.28 });
    }
    start = performance.now();
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick(now) {
    const W = innerWidth, H = innerHeight, t = now - start;
    const alpha = t > 3400 ? Math.max(0, 1 - (t - 3400) / 900) : 1;
    ctx.clearRect(0, 0, W, H);
    parts = alpha > 0 ? parts.filter((p) => p.y < H + 60) : [];
    for (const p of parts) {
      p.vx *= 0.975; p.vy = p.vy * 0.975 + p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.tilt += 0.12;
      ctx.save(); ctx.globalAlpha = alpha; ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.cos(p.tilt)); ctx.fillStyle = p.c;
      if (p.hex) { ctx.beginPath(); const r = p.w * 0.6; for (let j = 0; j < 6; j++) { const a = (Math.PI / 3) * j; j ? ctx.lineTo(r * Math.cos(a), r * Math.sin(a)) : ctx.moveTo(r, 0); } ctx.closePath(); ctx.fill(); }
      else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    if (parts.length) raf = requestAnimationFrame(tick); else { raf = 0; ctx.clearRect(0, 0, W, H); }
  }
  function stop() { parts = []; if (raf) { cancelAnimationFrame(raf); raf = 0; } if (ctx) ctx.clearRect(0, 0, innerWidth, innerHeight); }
  return { fire, stop };
})();

/* =========================================================
   مدير النوافذ
   ========================================================= */
const Modal = (() => {
  const stack = [];
  function open(content, { id = '', cls = '', dismissable = true, onClose = null, onKey = null } = {}) {
    const overlay = el('div', { class: 'overlay' });
    const dlg = el('div', { class: `dialog ${cls}`, role: 'dialog', 'aria-modal': 'true', tabindex: '-1' });
    if (dismissable) dlg.append(el('button', { type: 'button', class: 'dialog-close', 'aria-label': 'إغلاق', html: ICONS.close, onclick: () => close() }));
    dlg.append(content); overlay.append(dlg);
    let downOnOverlay = false;
    overlay.addEventListener('pointerdown', (e) => { downOnOverlay = e.target === overlay; });
    overlay.addEventListener('click', (e) => { if (dismissable && downOnOverlay && e.target === overlay) close(); });
    $('#modals').append(overlay);
    const entry = { id, overlay, dlg, dismissable, onClose, onKey, prevFocus: document.activeElement };
    stack.push(entry);
    const f = dlg.querySelector('[data-autofocus]') || dlg;
    f.focus({ preventScroll: true });
    return entry;
  }
  function close() {
    const e = stack.pop(); if (!e) return;
    e.overlay.remove();
    if (e.onClose) e.onClose();
    if (e.prevFocus && document.contains(e.prevFocus) && e.prevFocus.focus) e.prevFocus.focus({ preventScroll: true });
  }
  return {
    open, close,
    closeAll() { while (stack.length) close(); },
    isOpen: () => stack.length > 0,
    has: (id) => stack.some((e) => e.id === id),
    top: () => stack[stack.length - 1] || null
  };
})();

function Confirm({ title, text, confirmLabel, onConfirm, danger = false, focusCancel = false }) {
  const ok = el('button', { type: 'button', class: `btn ${danger ? 'btn-coral' : 'btn-yellow'}`, text: confirmLabel, 'data-autofocus': !focusCancel, onclick: () => { Modal.close(); onConfirm(); } });
  const cancel = el('button', { type: 'button', class: 'btn', text: 'إلغاء', 'data-autofocus': focusCancel, onclick: () => Modal.close() });
  Modal.open(el('div', { class: 'stack' }, [
    el('h2', { text: title }),

}

/* =========================================================
   HexCell — خلية واحدة
   ========================================================= */
const CELL_K = 0.92, FRAME_K = 0.8, SHADE_Y = 8;
const HexCell = {
  create(i, x, y, onActivate) {
    const g = sv('g', { class: 'cell neutral', transform: `translate(${x.toFixed(2)} ${y.toFixed(2)})`, tabindex: '0', role: 'button', 'data-idx': String(i) });
    const shade = sv('polygon', { class: 'shade', points: hexPoints(CELL_K), transform: `translate(0 ${SHADE_Y})` });
    const lift = sv('g', { class: 'lift' }), pop = sv('g', { class: 'pop' });
    const face = sv('polygon', { class: 'face', points: hexPoints(CELL_K) });
    const text = sv('text', { class: 'letter', x: '0', y: '3', 'text-anchor': 'middle', 'dominant-baseline': 'central' });
    const ring = sv('polygon', { class: 'ring', points: hexPoints(CELL_K) });
    pop.append(face, text); lift.append(pop); g.append(shade, lift, ring);
    HexCell.bind(g, i, onActivate);
    return { g, text };
  },
  bind(g, i, onActivate) {
    let timer = 0, fired = false, sx = 0, sy = 0;
    const cancel = () => { clearTimeout(timer); timer = 0; };
    const owned = () => App.round.owners[i] !== null;
    g.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      fired = false; sx = e.clientX; sy = e.clientY; cancel();
      timer = setTimeout(() => {
        timer = 0;
        if (owned() && !App.win && !Modal.isOpen()) { fired = true; try { navigator.vibrate && navigator.vibrate(15); } catch (_) {} OwnedMenu.open(i); }
      }, 550);
    });
    g.addEventListener('pointermove', (e) => { if (timer && Math.hypot(e.clientX - sx, e.clientY - sy) > 12) cancel(); });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach((t) => g.addEventListener(t, cancel));
    g.addEventListener('click', () => { if (fired) { fired = false; return; } onActivate(i); });
    g.addEventListener('contextmenu', (e) => { e.preventDefault(); cancel(); if (owned()) OwnedMenu.open(i); });
    g.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      e.preventDefault();
      if (e.shiftKey && owned()) OwnedMenu.open(i); else onActivate(i);
    });
  }
};

/* =========================================================
   GameBoard — الشبكة كاملة
   ========================================================= */
const GameBoard = (() => {
  let svgEl = null; const cells = [];
  let lastHint = 0, introTimer = 0;

  function build(host) {
    const items = [];
    for (let c = 0; c < COLS; c++) { items.push({ r: -1, c, frame: 1 }); items.push({ r: ROWS, c, frame: 1 }); }
    for (let r = 0; r < ROWS; r++) {
      items.push({ r, c: -1, frame: 0 }); items.push({ r, c: COLS, frame: 0 });
      for (let c = 0; c < COLS; c++) items.push({ r, c, frame: null });
    }
    items.sort((a, b) => a.r - b.r);
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const it of items) { const p = centerOf(it.r, it.c); x0 = Math.min(x0, p.x - HW / 2); x1 = Math.max(x1, p.x + HW / 2); y0 = Math.min(y0, p.y - S); y1 = Math.max(y1, p.y + S + SHADE_Y); }
    const PAD = 24;
    svgEl = sv('svg', { class: 'board', viewBox: `${(x0 - PAD).toFixed(1)} ${(y0 - PAD).toFixed(1)} ${(x1 - x0 + PAD * 2).toFixed(1)} ${(y1 - y0 + PAD * 2).toFixed(1)}`, preserveAspectRatio: 'xMidYMid meet', 'aria-label': 'شبكة الحروف' });
    svgEl.innerHTML = '<defs><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur in="SourceAlpha" stdDeviation="9" result="b"/><feFlood flood-color="#FFF57F"/><feComposite in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
    for (const it of items) {
      const { x, y } = centerOf(it.r, it.c);
      if (it.frame !== null) {
        const g = sv('g', { class: `frame f${it.frame}`, transform: `translate(${x.toFixed(2)} ${y.toFixed(2)})`, 'aria-hidden': 'true' });
        g.append(sv('polygon', { class: 'f-shade', points: hexPoints(FRAME_K), transform: `translate(0 ${SHADE_Y})` }), sv('polygon', { class: 'f-face', points: hexPoints(FRAME_K) }));
        svgEl.append(g);
      } else {
        const i = it.r * COLS + it.c;
        cells[i] = HexCell.create(i, x, y, activate);
        cells[i].g.style.setProperty('--d', String(it.r + it.c));
        svgEl.append(cells[i].g);
      }
    }
    svgEl.addEventListener('contextmenu', (e) => e.preventDefault());
    host.append(svgEl);
  }

  function activate(i) {
    if (Modal.isOpen()) return;
    if (App.win) { WinnerModal.open(); return; }
    if (App.round.owners[i] === null) { TeamSelector.open(i); return; }
    retrigger(i, 'shake', 340);
    const now = Date.now();
    if (now - lastHint > 3500) { lastHint = now; Toast.show('الخلية مسجّلة. لتعديلها: زر الفأرة الأيمن أو ضغط مطوّل'); }
  }

  function retrigger(i, cls, ms) {
    const g = cells[i].g; g.classList.remove(cls);
    void g.getBoundingClientRect();
    g.classList.add(cls);
    clearTimeout(g['_' + cls]); g['_' + cls] = setTimeout(() => g.classList.remove(cls), ms);
  }

  function update() {
    if (!svgEl || !App.round) return;
    const R = App.round, order = new Map((App.win ? App.win.path : []).map((k, n) => [k, n]));
    svgEl.classList.toggle('won', !!App.win);
    cells.forEach(({ g, text }, i) => {
      const o = R.owners[i];
      if (text.textContent !== R.letters[i]) text.textContent = R.letters[i];
      g.classList.toggle('neutral', o === null);
      g.classList.toggle('own-0', o === 0);
      g.classList.toggle('own-1', o === 1);
      const onPath = order.has(i);
      g.classList.toggle('on-path', onPath);
      if (onPath) g.style.setProperty('--i', String(order.get(i)));
      g.setAttribute('aria-label', `حرف ${R.letters[i]}، ${o === null ? 'متاحة' : 'للفريق ' + teamName(o)}`);
    });
  }

  function intro() {
    if (!svgEl) return;
    svgEl.classList.remove('intro'); void svgEl.getBoundingClientRect(); svgEl.classList.add('intro');
    clearTimeout(introTimer); introTimer = setTimeout(() => svgEl.classList.remove('intro'), 900);
  }

  return { build, update, intro, claim: (i) => retrigger(i, 'claim', 650) };
})();

function TeamEditor(t, onChange) {
  const T = App.settings.teams;
  const input = el('input', { type: 'text', class: 'name-input', maxlength: '24', value: T[t].name, placeholder: DEFAULT_NAMES[t], 'aria-label': `اسم ${DEFAULT_NAMES[t]}`, 'data-team-name': String(t) });

  const setColor = (c) => {
    if (sameColor(c, T[1 - t].color)) { Toast.show('هذا اللون مستخدم للفريق الآخر'); refresh(); return; }
    T[t].color = c.toUpperCase(); applyTeamColors(); onChange();
  };
  const swatches = PRESETS.map((c) => el('button', { type: 'button', class: 'swatch', role: 'radio', 'aria-label': `اللون ${c}`, 'data-color': c, style: `background:${c}`, onclick: () => setColor(c) }));

  colorInput.addEventListener('input', () => setColor(colorInput.value));
  const custom = el('label', { class: 'swatch custom', title: 'لون مخصص' }, [colorInput]);

  function refresh() {
    const cur = T[t].color, other = T[1 - t].color;
    swatches.forEach((b) => { const c = b.dataset.color; b.setAttribute('aria-checked', String(sameColor(c, cur))); b.disabled = sameColor(c, other); });
    const isCustom = !PRESETS.some((c) => sameColor(c, cur));
    custom.classList.toggle('checked', isCustom);
    custom.style.background = isCustom ? cur : '';
    colorInput.value = cur.toLowerCase();
    if (document.activeElement !== input) input.value = T[t].name;
  }

  const node = el('div', { class: 'editor', 'data-team': String(t) }, [
    el('div', { class: 'editor-head' }, [
      el('span', { class: 'mini-hex' }), el('strong', { text: DEFAULT_NAMES[t] }),
      el('span', { class: 'dir', html: (t === 0 ? ICONS.dirH : ICONS.dirV) + `<span>${DIR_TEXT[t]}</span>` })
    ]),
    el('label', { class: 'field' }, ['الاسم', input]),
    el('div', { class: 'field' }, ['اللون', el('div', { class: 'swatches', role: 'radiogroup', 'aria-label': `لون ${DEFAULT_NAMES[t]}` }, [...swatches, custom])])
  ]);
  return { node, refresh, input };
}

/* =========================================================
   StartScreen
   ========================================================= */
const StartScreen = {
  show() { setScreen('start'); StartScreen.intro(); },
  intro() {
    const root = $('#screen-start'); root.replaceChildren();
    const resumable = !!(App.round && App.round.active);
    root.append(el('div', { class: 'start-inner' }, [
      el('img', { class: 'start-logo', src: LOGO_SRC, alt: 'جمعية صقيل لتنمية الشباب' }),
      el('div', { class: 'tiles', 'aria-hidden': 'true' }, ['ح', 'ر', 'و', 'ف'].map((ch, k) => el('span', { class: `tile tile-${k}`, style: `--k:${k}`, text: ch }))),
      el('h1', { class: 'start-title', text: 'حروف مع صقيل' }),
      el('div', { class: 'start-actions' }, [
        el('button', { type: 'button', class: 'btn btn-yellow btn-xl', id: 'btnStart', onclick: () => StartScreen.setup() }, 'ابدأ'),
        resumable ? el('button', { type: 'button', class: 'btn btn-lg', id: 'btnResume', onclick: () => Actions.resume() }, `استكمال الجولة ${toAr(App.round.no)}`) : null
      ])
    ]));
  },
  setup() {
    const root = $('#screen-start'); root.replaceChildren();
    const eds = [0, 1].map((t) => TeamEditor(t, () => { eds.forEach((e) => e.refresh()); persistSoon(); }));
    root.append(el('div', { class: 'setup' }, [
      el('div', { class: 'setup-head' }, [el('img', { src: LOGO_SRC, alt: '' }), el('h2', { text: 'جهّز الفريقين' })]),
      el('div', { class: 'editors' }, eds.map((e) => e.node)),
      el('div', { class: 'setup-actions' }, [
        el('button', { type: 'button', class: 'btn btn-yellow btn-xl', id: 'btnStartRound', onclick: () => Actions.startGame() }, 'ابدأ الجولة'),
        el('button', { type: 'button', class: 'btn btn-ghost', onclick: () => StartScreen.intro() }, 'رجوع')
      ])
    ]));
    eds.forEach((e) => e.refresh());
  }
};

/* =========================================================
   GamePanel — اللوحة الجانبية
   ========================================================= */
const GamePanel = (() => {
  const refs = {}; let built = false;
  function build() {
    $('#panelLogo').src = LOGO_SRC;
    document.querySelectorAll('[data-icon]').forEach((n) => {
      const label = n.dataset.label;
      n.innerHTML = ICONS[n.dataset.icon] + (label ? `<span>${label}</span>` : '');
    });
    refs.teams = [0, 1].map((t) => {
      const root = document.querySelector(`.team[data-team="${t}"]`);
      return { root, hex: $('.team-hex', root), count: $('.team-count', root), name: $('.team-name', root) };
    });
    refs.undo = $('#btnUndo'); refs.mute = $('#btnMute'); refs.fsIcon = $('#fsIcon'); refs.fsLabel = $('#fsLabel');
    refs.undo.addEventListener('click', () => Actions.undo());
    $('#btnNew').addEventListener('click', () => Actions.requestNewRound());
    $('#btnReset').addEventListener('click', () => Actions.requestReset());
    $('#btnSettings').addEventListener('click', () => SettingsModal.open());
    $('#btnFs').addEventListener('click', () => Fullscreen.toggle());
    refs.mute.addEventListener('click', () => { App.settings.sound = !App.settings.sound; update(); persistNow(); Toast.show(App.settings.sound ? 'الأصوات مفعّلة' : 'الأصوات مكتومة'); });
    built = true;
  }
  function update() {
    if (!built || !App.round) return;
    const R = App.round;
    $('#roundNo').textContent = toAr(R.no);
    refs.teams.forEach((c, t) => {
      c.name.textContent = teamName(t);
      const n = toAr(R.owners.filter((o) => o === t).length);
      if (c.count.textContent !== n) { c.count.textContent = n; c.hex.classList.remove('bump'); void c.hex.offsetWidth; c.hex.classList.add('bump'); }
      c.root.classList.toggle('winner', !!App.win && App.win.team === t);
    });
    refs.undo.disabled = R.history.length === 0;
    const muted = !App.settings.sound;
    refs.mute.setAttribute('aria-pressed', String(muted));
    refs.mute.setAttribute('aria-label', muted ? 'تشغيل الأصوات' : 'كتم الأصوات');
    refs.mute.title = muted ? 'تشغيل الأصوات' : 'كتم الأصوات';
    refs.mute.innerHTML = muted ? ICONS.volOff : ICONS.volOn;
    const fs = !!Fullscreen.element();
    refs.fsIcon.innerHTML = fs ? ICONS.fsExit : ICONS.fs;
    refs.fsLabel.textContent = fs ? 'إنهاء ملء الشاشة' : 'ملء الشاشة';
  }
  return { build, update };
})();

/* =========================================================
   SettingsModal
   ========================================================= */
function Toggle(label, key) {
  const b = el('button', { type: 'button', class: 'switch', role: 'switch', 'aria-checked': String(App.settings[key]), 'data-setting': key }, [
    el('span', { text: label }), el('span', { class: 'switch-track' }, [el('span', { class: 'switch-thumb' })])
  ]);
  b.addEventListener('click', () => {
    App.settings[key] = !App.settings[key];
    b.setAttribute('aria-checked', String(App.settings[key]));
    if (key === 'sound' && App.settings.sound) Sound.claim();
    GamePanel.update(); persistNow();
  });
  return b;
}
const SettingsModal = {
  open() {
    if (Modal.isOpen()) return;
    const eds = [0, 1].map((t) => TeamEditor(t, sync));
    function sync() { eds.forEach((e) => e.refresh()); GamePanel.update(); GameBoard.update(); persistSoon(); }
    Modal.open(el('div', { class: 'settings' }, [
      el('h2', { text: 'الإعدادات' }),
      el('div', { class: 'editors' }, eds.map((e) => e.node)),
      el('div', { class: 'toggles' }, [Toggle('المؤثرات الصوتية', 'sound'), Toggle('تأثير الاحتفال', 'confetti')]),
      el('div', { class: 'settings-actions' }, [
        el('button', { type: 'button', class: 'btn btn-lg', 'data-action': 'reshuffle', onclick: () => Actions.requestReshuffle() }, [el('span', { html: ICONS.shuffle }), 'إعادة توزيع الحروف']),
        el('button', { type: 'button', class: 'btn btn-yellow btn-lg', 'data-action': 'done', onclick: () => Modal.close() }, 'تم')
      ])
    ]), { id: 'settings', cls: 'dialog-settings', onClose: () => { normalizeNames(); GamePanel.update(); GameBoard.update(); persistNow(); } });
    eds.forEach((e) => e.refresh());
  }
};

/* =========================================================
   ملء الشاشة
   ========================================================= */
const Fullscreen = {
  element: () => document.fullscreenElement || document.webkitFullscreenElement || null,
  toggle() {
    const d = document, root = d.documentElement;
    if (Fullscreen.element()) { const ex = d.exitFullscreen || d.webkitExitFullscreen; if (ex) ex.call(d); return; }
    const req = root.requestFullscreen || root.webkitRequestFullscreen;
    const fail = () => Toast.show('تعذّر ملء الشاشة هنا — افتح الملف مباشرة في المتصفح');
    if (!req) { Toast.show('المتصفح لا يدعم ملء الشاشة'); return; }
    try { const p = req.call(root); if (p && typeof p.catch === 'function') p.catch(fail); } catch (_) { fail(); }
  },
  sync() { document.body.classList.toggle('is-fs', !!Fullscreen.element()); GamePanel.update(); }
};
document.addEventListener('fullscreenchange', Fullscreen.sync);
document.addEventListener('webkitfullscreenchange', Fullscreen.sync);

/* =========================================================
   العمليات
   ========================================================= */
let winTimer = 0;
function setScreen(name) {
  App.screen = name;
  $('#screen-start').classList.toggle('active', name === 'start');
  $('#screen-game').classList.toggle('active', name === 'game');
}
function commit() { GameBoard.update(); GamePanel.update(); persistNow(); }

function evaluateWin(celebrate) {
  const had = !!App.win;
  let win = null;
  for (const t of [0, 1]) { const p = findWinPath(App.round.owners, t); if (p) { win = { team: t, path: p }; break; } }
  App.win = win;
  GameBoard.update(); GamePanel.update();
  clearTimeout(winTimer);
  if (win && !had) {
    if (celebrate) { Sound.win(); if (App.settings.confetti) Confetti.fire(App.settings.teams[win.team].color); }
    winTimer = setTimeout(() => { if (App.win) WinnerModal.open(); }, celebrate ? 900 : 150);
  } else if (!win && had) {
    WinnerModal.close(); Confetti.stop();
  }
}

const Actions = {
  startGame() {
    normalizeNames(); Confetti.stop(); Modal.closeAll();
    App.round = makeRound(1); App.win = null;
    setScreen('game'); commit(); GameBoard.intro();
  },
  resume() {
    setScreen('game'); App.win = null; commit(); evaluateWin(false);
  },
  assign(i, t) {
    const R = App.round; if (App.win) return;
    const prev = R.owners[i]; if (prev === t) return;
    R.owners[i] = t; R.history.push({ i, p: prev, n: t });
    if (R.history.length > 400) R.history.shift();
    Sound.claim(); commit(); GameBoard.claim(i); evaluateWin(true);
  },
  clearCell(i) {
    const R = App.round; if (App.win) return;
    const prev = R.owners[i]; if (prev === null) return;
    R.owners[i] = null; R.history.push({ i, p: prev, n: null });
    Sound.undo(); commit(); evaluateWin(true);
  },
  undo() {
    if (!App.round) return;
    const R = App.round, h = R.history.pop();
    if (!h) { Toast.show('لا توجد عملية للتراجع'); return; }
    R.owners[h.i] = h.p;
    Sound.undo(); commit();
    if (h.p !== null) GameBoard.claim(h.i);
    evaluateWin(true);
    Toast.show(`تراجع: خلية «${R.letters[h.i]}»`);
  },
  requestNewRound() {
    const inProgress = !App.win && App.round.owners.some((o) => o !== null);
    if (!inProgress) { Actions.newRound(); return; }
    Confirm({ title: 'بدء جولة جديدة؟', text: 'الجولة الحالية لم تنتهِ، وستُمسح الشبكة ويُعاد توزيع الحروف.', confirmLabel: 'نعم، جولة جديدة', focusCancel: true, onConfirm: () => Actions.newRound() });
  },
  newRound() {
    Modal.closeAll(); Confetti.stop(); clearTimeout(winTimer);
    App.round = makeRound(App.round.no + 1); App.win = null;
    commit(); GameBoard.intro();
    Toast.show(`بدأت الجولة ${toAr(App.round.no)}`);
  },
  requestReset() {
    Confirm({ title: 'إعادة ضبط الجولة؟', text: 'ستعود كل الخلايا إلى الحالة المحايدة ويُمسح تقدّم هذه الجولة.', confirmLabel: 'نعم، أعد الضبط', danger: true, focusCancel: true, onConfirm: () => Actions.resetRound() });
  },
  resetRound() {
    Modal.closeAll(); Confetti.stop(); clearTimeout(winTimer);
    App.round.owners.fill(null); App.round.history = []; App.win = null;
    commit(); GameBoard.intro();
    Toast.show('أُعيد ضبط الجولة');
  },
  requestReshuffle() {
    if (!App.round.owners.some((o) => o !== null)) { Actions.reshuffle(); return; }
    Confirm({ title: 'إعادة توزيع الحروف؟', text: 'ستتغير حروف الشبكة كلها، وتبقى الخلايا الملوّنة بألوانها.', confirmLabel: 'نعم، وزّع الحروف', onConfirm: () => Actions.reshuffle() });
  },
  reshuffle() {
    App.round.letters = shuffle(LETTERS).slice(0, N);
    commit(); GameBoard.intro();
    Toast.show('أُعيد توزيع الحروف');
  }
};

/* =========================================================
   لوحة المفاتيح
   ========================================================= */
document.addEventListener('keydown', (e) => {
  const top = Modal.top();
  if (top) {
    if (top.onKey && top.onKey(e)) return;
    if (e.key === 'Escape' && top.dismissable) { e.preventDefault(); Modal.close(); return; }
    if (e.key === 'Tab') {
      const f = [...top.dlg.querySelectorAll('button:not(:disabled),input')];
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1], a = document.activeElement;
      if (e.shiftKey && (a === first || a === top.dlg)) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && (a === last || !top.dlg.contains(a))) { e.preventDefault(); first.focus(); }
    }
    return;
  }
  if (App.screen === 'game' && (e.ctrlKey || e.metaKey) && e.code === 'KeyZ' && !e.shiftKey) { e.preventDefault(); Actions.undo(); }
});
window.addEventListener('pagehide', persistNow);
document.addEventListener('visibilitychange', () => { if (document.hidden) persistNow(); });

/* =========================================================
   التشغيل
   ========================================================= */
async function init() {
  GameBoard.build($('#stage'));
  GamePanel.build();
  hydrate(await Store.load());
  applyTeamColors();
  StartScreen.show();
}
window.HuroofDebug = { NEIGHBORS, findWinPath, centerOf, ROWS, COLS, get state() { return App; }, get storeMode() { return Store.mode; } };
init();
})();
</script>
