backend:
  name: git-gateway
  branch: master

media_folder: "assets/img/uploads"
public_folder: "assets/img/uploads" 

locale: 'ar' 

collections:
  - name: "site_data"
    label: "بيانات الموقع"
    files:
      - label: "مكتبة الملفات"
        name: "files"
        file: "data/files.json"
        fields:
          - name: "licenses"
            label: "التراخيص والوثائق الرسمية"
            widget: "list"
            fields:
              - {label: "عنوان الوثيقة", name: "title", widget: "string"}
              - {label: "الوصف", name: "description", widget: "string", required: false}
              - {label: "الملف المرفق", name: "file", widget: "file"}
          
          - name: "sponsors"
            label: "شعارات الجهات"
            widget: "list"
            fields:
              - {label: "اسم الجهة", name: "name", widget: "string"}
              - {label: "الشعار", name: "logo", widget: "image"}
