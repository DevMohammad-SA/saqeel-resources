backend:
  name: github
  repo: DevMohammad-SA/saqeel-resources
  branch: master

media_folder: "assets/uploads"
public_folder: "assets/uploads"

collections:
  - name: "dynamic_pages"
    label: "إدارة محتوى الموقع"
    files:
      - file: "data/association.json"
        label: "بيانات الجمعية"
        name: "association"
        format: "json"
        fields:
          - label: "ملفات الجمعية"
            name: "files_list"
            widget: "list"
            fields:
              - {label: "عنوان الملف (مثل: شهادة الحساب البنكي)", name: "title", widget: "string"}
              - {label: "رفع الملف", name: "file", widget: "file"}

      - file: "data/identity.json"
        label: "الهوية البصرية"
        name: "identity"
        format: "json"
        fields:
          - label: "ملفات الهوية"
            name: "files_list"
            widget: "list"
            fields:
              - {label: "عنوان الملف/الشعار", name: "title", widget: "string"}
              - {label: "رفع الملف", name: "file", widget: "file"}

      - file: "data/projects.json"
        label: "المشاريع"
        name: "projects"
        format: "json"
        fields:
          - label: "قائمة المشاريع"
            name: "projects_list"
            widget: "list"
            fields:
              - {label: "اسم المشروع", name: "title", widget: "string"}
              - {label: "وصف مختصر للمشروع", name: "description", widget: "text", required: false}
              - label: "ملفات المشروع"
                name: "project_files"
                widget: "list"
                fields:
                  - {label: "عنوان الملف", name: "file_title", widget: "string"}
                  - {label: "رفع الملف", name: "file", widget: "file"}
