<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المسابقات التفاعلية | صقيل</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap" rel="stylesheet">
  <style>
    .cards-container .nav-card { padding: 0; overflow: hidden; }
    .cards-container .card-thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
    }
    .cards-container .nav-card .card-body { padding: 20px 30px 30px; }
    .card-tag {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 12px;
      font-size: .75rem;
      font-weight: 700;
      color: var(--blue);
      background: rgba(37, 99, 235, .1);
      border-radius: 999px;
    }
  </style>
</head>

<body class="home-page-body">

  <header class="navbar">
    <div class="container" style="justify-content:center;">
      <img src="assets/img/logo-horizontal.png" alt="شعار جمعية صقيل" height="60">
    </div>
  </header>

  <main class="hero-section">
    <div class="container text-center">
      <h1 class="main-title">المسابقات التفاعلية</h1>
      <p class="sub-title">اختر إحدى المسابقات وابدأ التحدي.</p>

      <div class="cards-container">
        <a href="games/huroof.html" class="nav-card" target="_blank" rel="noopener">
          <img src="assets/img/games/huroof-thumb.webp" alt="حروف مع صقيل" class="card-thumb">
          <div class="card-body">
            <h2>حروف مع صقيل</h2>
            <p>مسابقة تفاعلية لتكوين الكلمات من الحروف.</p>
            <span class="card-tag">ثقافية</span>
          </div>
        </a>

        <a href="games/tarabee.html" class="nav-card" target="_blank" rel="noopener">
          <img src="assets/img/games/tarabee-thumb.png" alt="ترابيع صقيل" class="card-thumb">
          <div class="card-body">
            <h2>ترابيع صقيل</h2>
            <p>مسابقة تفاعلية على شكل شبكة تربيعية.</p>
            <span class="card-tag">ثقافية</span>
          </div>
        </a>
      </div>
    </div>
  </main>

</body>

</html>
